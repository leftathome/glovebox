nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/leftathome/glovebox
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  # Limits sized for the spec 13 archive-delivery workload: serving
  # multi-GiB tus.io PATCH streams plus rolling sha256 + per-connection
  # http buffer overhead spikes the Go runtime working set well above
  # the pre-spec-13 128Mi/512Mi tier. 512Mi OOM-killed a 12 GiB mbox
  # upload mid-PATCH (glovebox-5ud9); 2Gi limit + a GOMEMLIMIT 100Mi
  # under the cgroup cap lets the runtime self-throttle GC before the
  # kernel intervenes. If ingest.archives.enabled is false, scaling
  # back to 128Mi/512Mi is safe.
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 2Gi

nodeSelector: {}
affinity: {}
tolerations: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

config:
  stagingDir: /data/glovebox/staging
  quarantineDir: /data/glovebox/quarantine
  auditDir: /data/glovebox/audit
  failedDir: /data/glovebox/failed
  agentsDir: /data/agents
  sharedDir: /data/shared
  metricsPort: 9090
  watchMode: fsnotify
  pollIntervalSeconds: 5
  # 8 scan workers (was 4): observed 2026-05-23 mbox-importer run pushing
  # ~52 msg/sec into a 4-worker scanner -- queue depth climbed faster than
  # workers drained. Doubling at the chart default doesn't change behavior
  # for connector-only workloads (light steady-state load) but absorbs
  # archive-importer bursts. Operators on low-CPU nodes can override
  # back down to 4 if needed.
  scanWorkers: 8
  scanTimeoutSeconds: 30
  scanChunkSizeBytes: 262144
  agentAllowlist:
    - messaging
    - media
    - calendar
    - itinerary
  ingest:
    enabled: true
    port: 9091
    maxBodyBytes: 67108864
    maxMetadataBytes: 262144
    # 5000 (was 100): observed 2026-05-23 the prior default tripped after
    # the first ~100 messages of a mbox-importer Job, returning 429s that
    # the HTTPStagingBackend exhausted retries on (recorded as ingest
    # errors). 5000 gives the scanner ~125 sec of burst-absorption headroom
    # at 40 items/sec drain. Memory cost: ~250 MiB at full queue with
    # ~50 KiB staging items. Operators with stricter memory budgets can
    # tune down; archive-importer-heavy workloads can tune up further.
    backpressureThreshold: 5000
    requestTimeoutSeconds: 60

# Known-subjects registry (spec 15 sec 11). Edit charts/glovebox/subjects.json
# directly -- there is no values key for its contents; the file is rendered
# verbatim into the ConfigMap and mounted at /etc/glovebox/subjects.json.
# Enforcement lives IN subjects.json ("enforce": true|false, default false);
# do NOT add a subjects_enforce config key (it was deliberately removed).

# Ingest source-policy registry (glovebox-9s60). Edit charts/glovebox/sources.json
# directly -- same model as subjects.json: rendered verbatim into the ConfigMap
# and mounted at /etc/glovebox/sources.json. It maps an AUTHENTICATED ingest
# source-id to its connector lane (kind, data_subject_default, audience_default).
# The recognizer-scanner entry's data_subject_default is the operator knob
# (e_111111=Steve | household). audience_default ["operator"] keeps scans out of
# the openclaw per-person triage resolver.

persistence:
  staging:
    size: 1Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteMany  # shared between scanner + connectors
  quarantine:
    size: 5Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  audit:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  failed:
    size: 5Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  agents:
    size: 5Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  shared:
    size: 1Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  # Spec 13 archive-delivery storage. One PVC for both .tmp-archives/
  # and archives/ subtrees so they share st_dev (the listener's safety
  # check 503s the endpoint if they diverge -- which happens on any
  # CSI provisioner with per-volume block devices, like Longhorn). The
  # listener creates the two subdirs on first boot.
  archiveStorage:
    size: 200Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce

metrics:
  port: 9090
  servicePort: 9090
  annotations: true  # add prometheus.io/* annotations to all pods
  serviceMonitor:
    enabled: false    # create ServiceMonitor CRDs (requires prometheus-operator)
    interval: 30s
    labels: {}        # additional labels for ServiceMonitor (e.g., release: prometheus)

networkPolicy:
  enabled: true

