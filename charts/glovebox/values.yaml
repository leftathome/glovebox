# Schoology browser-session refresher (spec 06 §12). Disabled by
# default; opt-in by setting schoologyAuthRefresher.enabled=true. When
# enabled, the chart renders a CronJob, a dedicated ServiceAccount, and
# two ExternalSecrets (credentials + session) on top of the existing
# Schoology connector resources.
schoologyAuthRefresher:
  enabled: false
  # Every 12 days at 06:00 cluster TZ; ~48h headroom before the 14-day
  # Schoology cookie expiry.
  schedule: "0 6 */12 * *"
  image:
    repository: ghcr.io/leftathome/glovebox-schoology-auth-refresher
    # tag defaults to .Chart.AppVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  vault:
    addr: "http://vault.vault.svc.cluster.local:8200"
    k8sRole: "glovebox-schoology-refresher"
    kvMount: "secret"
    # KV v2 path holding {host, username, password} for the parent
    # Schoology account. Operator-provisioned; the refresher reads it.
    credentialsPath: "glovebox/schoology/default/credentials"
    # KV v2 path receiving the 5-field session JSON the refresher
    # writes; ESO syncs it into the connector pod.
    sessionPath: "glovebox/schoology/default/session"
    refreshInterval: "1m"
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-default
  # Remote Browserless browser the refresher drives via
  # auth.WithBrowserURL (spec 06 §12.10). The refresher image no longer
  # bundles Chromium; it connects out to a cluster-local Browserless
  # Service instead.
  browserless:
    # rod ControlURL for the Browserless endpoint, e.g.
    # ws://browserless.browserless.svc.cluster.local:3000. Empty (the
    # default) leaves BROWSERLESS_URL unset, so the binary falls back to
    # ROD_BROWSER_PATH (local/test only).
    url: ""
    # Optional Browserless API token. When tokenSecret.name is set the
    # CronJob projects BROWSERLESS_TOKEN from secretKeyRef{name,key} and
    # the binary appends it as a ?token=/&token= query param. Leave name
    # empty for token-less Browserless deployments.
    tokenSecret:
      name: ""
      key: token
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Schoology CONNECTOR (spec 12). Disabled by default; opt-in by setting
# schoologyConnector.enabled=true. When enabled the chart renders a
# Deployment, a Service, and a ConfigMap. The Deployment consumes the
# -schoology-session Secret (a single credentials.json) produced by the
# schoologyAuthRefresher ExternalSecret, so in a real install both
# schoologyConnector.enabled and schoologyAuthRefresher.enabled are set.
schoologyConnector:
  enabled: false
  image:
    repository: ghcr.io/leftathome/glovebox-schoology
    # tag defaults to .Chart.AppVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Optional explicit Schoology tenant host (e.g. yourschool.schoology.com).
  # When empty (the default) the connector reads SCHOOLOGY_HOST from the
  # -schoology-refresher-credentials Secret so it always matches the host
  # the refresher logged into.
  host: ""
  # Scheduler timezone (spec 12 §6.1).
  timezone: America/Los_Angeles
  # Name of an operator-provisioned Secret holding the bearer token for
  # POST /v1/poll under key SCHOOLOGY_TRIGGER_TOKEN. Empty leaves the
  # trigger token unset (the connector then accepts unauthenticated polls
  # from in-cluster callers reachable via NetworkPolicy).
  triggerTokenSecret: ""
  # Framework health/metrics port. The POST /v1/poll trigger listener is
  # served on healthPort+1.
  healthPort: 8080
  # Operator config rendered verbatim into config.json. Per spec 12 §10
  # kids use opaque labels (k1, k2) -- never legal names -- so PII stays
  # out of metadata/audit logs. The per-kid rules carry data_subject so
  # each child's school data routes under its own subject; the wildcard
  # tail + data_subject_default catch anything unmatched.
  config:
    rules:
      - match: "schoology:k1:assignment"
        destination: school
        data_subject: k1
        audience:
          - operator
      - match: "schoology:k1:feed"
        destination: school
        data_subject: k1
        audience:
          - operator
      - match: "schoology:k2:assignment"
        destination: school
        data_subject: k2
        audience:
          - operator
      - match: "schoology:k2:feed"
        destination: school
        data_subject: k2
        audience:
          - operator
      - match: "schoology:message"
        destination: school
        data_subject: household
        audience:
          - operator
      - match: "*"
        destination: school
        audience:
          - operator
    data_subject_default: household
    audience_default:
      - operator
    kids:
      # REPLACE the placeholder schoology_uid values with each child's real
      # Schoology UID before enabling the connector -- a 0 UID fails
      # ValidateConfig at startup.
      - name: k1
        schoology_uid: 0
      - name: k2
        schoology_uid: 0
    poll_schedule:
      weekdays_only: true
      windows:
        - start: "07:00"
          end: "19:00"
    trigger:
      debounce_seconds: 60
      listen_port: 8081
    attachments:
      max_size_mb: 25
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Spec 10 (external ingest auth) + spec 13 (archive delivery) wiring.
# These live at the top-level `ingest:` key (separate from `config.ingest:`,
# which carries the connector-scale /v1/ingest knobs from spec 08).
ingest:
  auth:
    enabled: false                          # opt-in; off by default
    vault:
      addr: "https://vault.vault.svc.cluster.local:8200"
      k8sRole: "glovebox-ingest"
      tokensPath: "glovebox/ingest-tokens"
      kvMount: "secret"
      # Homelab vaults commonly run with a self-signed cert; skip TLS
      # verification when true. Cluster-pod-network only, no external
      # exposure. For production-grade: false + mount the Vault CA cert.
      tlsSkipVerify: true
    reloadIntervalSeconds: 300              # periodic re-pull
    trustedProxyCIDRs:
      - "10.244.0.0/16"                     # placeholder: cluster Traefik pod CIDR
    perIPRateLimit:
      window: 60s
      maxRejected: 10
      lruCapacity: 1000                     # spec 10 §5.3 final (smaller than iteration-1 10000)
    globalRateLimit:
      window: 60s
      maxRejected: 100                      # spec 10 §5.3 backstop
  archives:
    enabled: false                          # opt-in; off by default
    # Root path under which .tmp-archives/ and archives/ live. A
    # dedicated dir (not /data/glovebox, which already holds the
    # staging/quarantine/audit/failed sibling mounts) avoids nested
    # PVC mounts. The persistence.archiveStorage PVC is mounted here
    # at install time.
    stagingRoot: /data/archive-storage
    maxUploadSize: 32212254720              # 30 GiB (Tus-Max-Size)
    perSourceMaxConcurrent: 4
    globalMaxConcurrent: 32
    perSourceSoftCapPct: 40                 # spec 13 §8.4 — per-entry untar admission cap
    globalHardCapPct: 95                    # 503 threshold
    globalHardCapHysteresisPct: 85          # 503-lift threshold
    patchIdleTimeoutSeconds: 300            # 5-min slowloris guard
    cleanupIntervalSeconds: 3600
    cleanupTmpAgeHours: 72                  # accommodates overnight laptop suspends
    cleanupFinalizeAgeHours: 1
    retention:
      doneArchiveDays: 7
    networkPolicy:
      # REPLACE with your recognizer namespace's `name:` label value (the
      # operator-set namespace label, NOT the kubelet-managed
      # kubernetes.io/metadata.name auto-label). The chart's NetworkPolicy
      # matches on `name: <this-value>` per spec 13 §8.1.
      recognizerNamespaceLabel: "openclaw-recognizer"
