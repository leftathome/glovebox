nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/leftathome/glovebox
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  # Limits sized for the spec 13 archive-delivery workload. Profiled under a
  # streamed multi-GiB tus.io PATCH (glovebox-g499, GODEBUG=gctrace=1 + cgroup
  # v2 memory.stat). The memory cost is NOT Go allocation -- the PATCH path
  # genuinely streams (io.Copy over a 32 KiB buffer + rolling sha256), so the
  # Go heap stays a flat ~4 MiB and total anon ~10 MiB regardless of upload
  # size. Nearly the entire footprint is OS PAGE CACHE from writing the archive
  # to the staging file (cgroup memory accounts page cache):
  #
  #   upload 2 GiB  -> anon ~9 MiB,  file cache ~2.0 GiB, peak ~2.1 GiB
  #   upload 12 GiB -> anon ~10 MiB, file cache ~2.9 GiB, peak ~3.0 GiB
  #
  # Page cache is reclaimable, but DIRTY pages (not yet flushed) accumulate
  # under sustained write; 512Mi OOM-killed a 12 GiB upload because dirty pages
  # outran writeback (glovebox-5ud9). The cache plateaus at the kernel
  # dirty-page ceiling (vm.dirty_ratio), so it does NOT scale with file size --
  # a 12 GiB upload peaks at ~3 GiB, the same order as 2 GiB. Size the LIMIT for
  # (expected concurrent uploads x ~3Gi dirty-page working set), not for archive
  # size. 2Gi covers a single upload (cache reclaims to fit) with little
  # concurrency headroom; raise it for the recognizer's expected concurrent set.
  # NOTE: GOMEMLIMIT does NOT help this path -- it caps the Go heap (~10 MiB
  # here), not page cache; it only matters for the scan-side heap. A code-side
  # reduction (sync_file_range / fadvise(DONTNEED) to bound dirty pages) is
  # tracked as an optional optimization on glovebox-jolp.
  # If ingest.archives.enabled is false, scaling back to 128Mi/512Mi is safe.
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 2Gi

nodeSelector: {}
affinity: {}
tolerations: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# ---------------------------------------------------------------------------
# Enricher containment
#
# Eight workloads run the binary enrichers: the arxiv, gmail, imap, outlook and
# semantic-scholar connectors, and all three importers (apple, mbox, walhelm).
# They are identifiable two independent ways that agree -- their Dockerfiles
# build FROM the enricher-runtime image, and their main.go blank-imports
# connector/enrich/{pdf,ocr,office}. Those three packages fork `pdftotext`,
# `tesseract` and `pandoc`; enrich/html and enrich/passthrough are pure Go and
# fork nothing, which is why the other 19 connectors are not on the list.
#
# Those forked parsers read bytes an attacker chose (an emailed attachment, a
# fetched PDF), so they are this system's main remote-code-execution surface.
# connector/enrich/limits.go already bounds each RUN -- a 120s timeout, 64 MiB
# of stdout, 64 KiB of stderr. The two settings below and the resource limits
# on those eight workloads bound the PROCESS: what the parser may ask the
# kernel for, and how much of the node it may consume before the kernel stops
# it. Read them as blast-radius limits, not as a sandbox; a kernel bug reached
# through an allowed syscall is still a kernel bug.
#
# Those eight carry `resources` of 1 CPU / 1Gi instead of the 200m/128Mi the
# API-only connectors use. Note the direction: this is LARGER, for the opposite
# of the obvious reason. 128Mi cannot start pandoc's Haskell runtime and cannot
# hold a 300dpi page bitmap for tesseract, so the first operator to enable
# enrichment would have hit OOMKilled on a legitimate document and deleted the
# limits block outright -- and a limit that survives contact with real files is
# worth more than a tighter one that gets removed. 1Gi leaves the process caps
# in connector/enrich/limits.go (64 MiB of output) as the binding constraint
# rather than the cgroup; 1 CPU still bounds a parser stuck in a spin loop to
# one core of the node. Lower them if you know your document mix -- but measure
# with a real OCR job first, and expect enrichment failures, not a tidier pod,
# if you go back under ~256Mi.
# ---------------------------------------------------------------------------

# Seccomp profile for every pod this chart owns.
#
# RuntimeDefault is the container runtime's own filter (containerd's and
# Docker's default profile), which denies roughly forty syscalls almost no
# application needs and an exploit chain usually does -- keyctl, ptrace,
# userfaultfd, the kernel-module and BPF calls. It is also what Pod Security
# Standards "restricted" requires, so leaving it unset is precisely what keeps
# these pods out of a restricted namespace.
# Applied chart-wide rather than only to the enricher pods: the scanner reads
# the same hostile content that the connectors do, the profile costs nothing,
# and a per-pod exception list is one more thing to get wrong.
# Set `type: ""` to render no profile at all (previous behaviour). Set
# `type: Localhost` plus `localhostProfile: <path>` to load a profile you have
# staged under the kubelet's seccomp root -- an audit-mode or a
# tesseract-specific profile, for instance.
seccompProfile:
  type: RuntimeDefault
  localhostProfile: ""

# Sandboxed runtime (gVisor's `gvisor`/`runsc`, Kata's `kata-containers`) for
# every pod, overridable per connector and per importer.
#
# Empty on purpose and it should stay empty unless you have installed one:
# a RuntimeClass that does not exist on the cluster leaves pods Pending
# forever, and which runtimes exist, on which node pools, is a cluster-level
# decision this chart cannot see. It is exposed because if you HAVE installed
# gVisor, the eight enricher workloads are the ones worth spending it on --
# they are where an untrusted parser meets the host kernel -- and pointing
# them at it should not require patching rendered manifests. Expect a real
# syscall-latency cost on the enrichers; measure before applying it globally.
runtimeClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

config:
  # Registry overrides. Each corresponds to one of the JSON files the chart
  # ships (charts/glovebox/{rules,subjects,sources}.json). Those baked files
  # are deliberately NEUTRAL -- an empty, non-enforcing subject roster and
  # empty per-source data_subject defaults -- because they would otherwise
  # publish a specific deployment's household identity (glovebox-0nzk).
  #
  # Set these to supply your own registry as structured YAML. Leaving one
  # unset keeps the baked default. Configure your roster HERE (in your private
  # values), not by editing the chart: a chart upgrade replaces the baked file,
  # so a forked roster would be silently dropped and enforcement would fall
  # back to off (glovebox-pyb9).
  #
  # subjectsJson:
  #   enforce: true
  #   subjects:
  #     - entity_id: e_abc123
  #       display: Operator          # at-rest legibility only; never routed
  #       principals: []
  #       default_audience: [subject]
  # sourcesJson:
  #   enforce: true
  #   sources:
  #     - source_id: recognizer-scanner
  #       kind: recognizer-scanner
  #       data_subject_default: e_abc123
  #       audience_default: [operator]
  rulesJson: null
  subjectsJson: null
  sourcesJson: null

  stagingDir: /data/glovebox/staging
  quarantineDir: /data/glovebox/quarantine
  auditDir: /data/glovebox/audit
  failedDir: /data/glovebox/failed
  agentsDir: /data/agents
  sharedDir: /data/shared
  metricsPort: 9090
  watchMode: fsnotify
  pollIntervalSeconds: 5
  # 8 scan workers (was 4): observed 2026-05-23 mbox-importer run pushing
  # ~52 msg/sec into a 4-worker scanner -- queue depth climbed faster than
  # workers drained. Doubling at the chart default doesn't change behavior
  # for connector-only workloads (light steady-state load) but absorbs
  # archive-importer bursts. Operators on low-CPU nodes can override
  # back down to 4 if needed.
  scanWorkers: 8
  scanTimeoutSeconds: 30
  # Bounds a single result delivery (file move + audit write). Prevents a wedged
  # file op on a networked staging/quarantine mount from stalling the result
  # consumer and deadlocking the pipeline (glovebox-lnzp). 0 disables the bound.
  deliveryTimeoutSeconds: 30
  scanChunkSizeBytes: 262144
  agentAllowlist:
    - messaging
    - media
    - calendar
    - itinerary
  ingest:
    enabled: true
    # Connector intake, POST /v1/ingest.
    port: 9091
    # Port for the bearer-authenticated endpoints -- /v1/archives* (spec 13)
    # and /v1/sanitize. 0 means "share `port`", which is what this chart has
    # always done and is kept as the default so an upgrade moves nothing.
    #
    # Sharing means the NetworkPolicy that grants the recognizer namespace
    # the archive endpoint necessarily also grants it unauthenticated
    # /v1/ingest (security review P0-7): one port, three route families,
    # three different auth models. Setting this to a distinct port (e.g.
    # 9093) splits them, after which the recognizer's ingress rule reaches
    # the archive endpoint only.
    #
    # This is a coordinated change: the recognizer namespace and any
    # /v1/sanitize caller are configured against `port` today and must be
    # repointed at the new port in the same window. See CHANGELOG.
    bearerPort: 0
    maxBodyBytes: 67108864
    maxMetadataBytes: 262144
    # 5000 (was 100): observed 2026-05-23 the prior default tripped after
    # the first ~100 messages of a mbox-importer Job, returning 429s that
    # the HTTPStagingBackend exhausted retries on (recorded as ingest
    # errors). 5000 gives the scanner ~125 sec of burst-absorption headroom
    # at 40 items/sec drain. Memory cost: ~250 MiB at full queue with
    # ~50 KiB staging items. Operators with stricter memory budgets can
    # tune down; archive-importer-heavy workloads can tune up further.
    backpressureThreshold: 5000
    requestTimeoutSeconds: 60

# Known-subjects registry (spec 15 sec 11). Edit charts/glovebox/subjects.json
# directly -- there is no values key for its contents; the file is rendered
# verbatim into the ConfigMap and mounted at /etc/glovebox/subjects.json.
# Enforcement lives IN subjects.json ("enforce": true|false, default false);
# do NOT add a subjects_enforce config key (it was deliberately removed).

# Ingest source-policy registry (glovebox-9s60). Edit charts/glovebox/sources.json
# directly -- same model as subjects.json: rendered verbatim into the ConfigMap
# and mounted at /etc/glovebox/sources.json. It maps an AUTHENTICATED ingest
# source-id to its connector lane (kind, data_subject_default, audience_default).
# The recognizer-scanner entry's data_subject_default is the operator knob: set
# it per deployment to the entity_id that owns scanner output (left empty here so
# an unconfigured install falls to the safe household default, NOT a specific
# person). audience_default ["operator"] keeps scans out of the openclaw
# per-person triage resolver.

# Ed25519 signing for the ruleset (docs/rule-signing.md).
#
# rules.json is the single place every boundary in the product is defined,
# and it ships as a ConfigMap: anyone with configmap-edit rights in this
# namespace can raise quarantine_threshold past anything the rules can
# score, or empty the rule list, and the scanner will start up and pass
# everything. Digest pinning (config.rulesSha256, unset by default) catches
# that only if someone remembers to re-copy the digest on every legitimate
# change. A signature moves the trust anchor onto a key that lives outside
# the cluster entirely.
#
# Everything here is unset by default and the chart renders byte-identically
# to before when it is; an install that does not opt in is not affected.
rules:
  # The ruleset, verbatim. Set with:
  #   --set-file rules.json=path/to/rules.json
  #
  # Signing requires the operator to control the exact bytes that land in
  # the ConfigMap, which config.rulesJson (structured YAML re-serialised by
  # the chart) does not give them. Unset means the usual precedence still
  # applies: config.rulesJson if set, otherwise the baked chart default.
  json: ""
  # The detached signature envelope produced by `rules-sign sign`:
  #   --set-file rules.signature=path/to/rules.json.sig
  # Rendered into the same ConfigMap as rules.json under the key
  # `rules.json.sig`. That co-location is safe: rewriting the signature
  # without the private key produces nothing that verifies.
  signature: ""
  signing:
    # "disabled" (default) | "permissive" | "required".
    #
    #   permissive -- verify when a signature is present, tolerate its
    #                 absence with a warning, but REFUSE a signature that
    #                 does not check out. The rollout state: deploy the
    #                 key, watch audit/ruleset.jsonl, then move on.
    #   required   -- a valid signature or the pod does not start.
    #
    # Verification failure is FAIL-CLOSED in both. A stopped scanner is
    # loud and loses nothing (items wait in staging, /readyz goes red);
    # a scanner enforcing attacker-written rules is silent and delivers
    # hostile content to agents with an audit trail that says PASS.
    mode: disabled
    # Name of an EXISTING Secret holding the trusted public key(s). Create
    # it yourself:
    #   kubectl create secret generic glovebox-rules-signing-key \
    #     --from-file=rules.pub=ruleset-signing.pub
    #
    # A Secret and not a ConfigMap, even though a public key is not
    # secret: the whole point is that the trust anchor must not sit in the
    # same class of object as the rules it authenticates. Namespace RBAC
    # that hands out configmap edit (which is common) must not thereby
    # hand out the ability to swap the verification key. Restrict write
    # access to this Secret by resourceName and the control means
    # something; leave it in the rules ConfigMap and it means nothing.
    #
    # The PRIVATE key belongs on an operator machine or an offline store.
    # It must never be in this chart, this repository, or CI.
    publicKeySecret: ""
    # Key within that Secret. May hold several PEM PUBLIC KEY blocks --
    # that is how a key roll is performed (see docs/rule-signing.md).
    publicKeySecretKey: rules.pub

persistence:
  staging:
    size: 1Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteMany  # shared between scanner + connectors
  quarantine:
    size: 5Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  audit:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  failed:
    size: 5Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  agents:
    size: 5Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  shared:
    size: 1Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce
  # Spec 13 archive-delivery storage. One PVC for both .tmp-archives/
  # and archives/ subtrees so they share st_dev (the listener's safety
  # check 503s the endpoint if they diverge -- which happens on any
  # CSI provisioner with per-volume block devices, like Longhorn). The
  # listener creates the two subdirs on first boot.
  archiveStorage:
    size: 200Gi
    storageClass: ""
    existingClaim: ""
    accessMode: ReadWriteOnce

metrics:
  port: 9090
  servicePort: 9090
  annotations: true  # add prometheus.io/* annotations to all pods
  serviceMonitor:
    enabled: false    # create ServiceMonitor CRDs (requires prometheus-operator)
    interval: 30s
    labels: {}        # additional labels for ServiceMonitor (e.g., release: prometheus)
  # When set, the NetworkPolicy restricts /metrics ingress to namespaces
  # labelled `name: <this value>` (typically the monitoring namespace, e.g.
  # "monitoring"). Left empty, metrics stay reachable from any pod -- which
  # is the previous behaviour, kept as the default so an install without
  # that namespace label does not lose its scraper on upgrade.
  allowedNamespaceLabel: ""

networkPolicy:
  enabled: true

connectors:
  # Generic source connectors. Each is disabled by default; set
  # enabled: true to deploy. `config` ships the connector's test-derived
  # sample config (edit for your sources). Secrets: either set `secrets`
  # to a pre-existing Secret name (envFrom) or set externalSecret.enabled
  # to have ESO materialize one from Vault (see docs/connectors/<name>.md).
  # schoology is configured separately via schoologyConnector below.

  rss:
    enabled: false
    image:
      repository: ghcr.io/leftathome/glovebox-rss
      tag: latest
      pullPolicy: IfNotPresent
    config:
      rules:
        - match: "feed:example-blog"
          destination: reader
        - match: "*"
          destination: inbox
      feeds:
        - name: example-blog
          url: "https://example.com/feed.xml"
      fetch_links: false
      link_policy:
        default: safe
        rules: []
    env: {}
    secrets: ""
    externalSecret:
      enabled: false
      refreshInterval: "1h"
      secretStoreRef:
        kind: ClusterSecretStore
        name: ""
      data: {}
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    state:
      size: 1Gi
      storageClass: ""
      existingClaim: ""
    nodeSelector: {}
    affinity: {}
    tolerations: []

  imap:
    enabled: false
    image:
      repository: ghcr.io/leftathome/glovebox-imap
      tag: latest
      pullPolicy: IfNotPresent
    config:
      folders:
        - name: INBOX
      rules:
        - match: "folder:INBOX"
          destination: messaging
        - match: "*"
          destination: general
    env: {}
    secrets: ""
    externalSecret:
      enabled: false
      refreshInterval: "1h"
      secretStoreRef:
        kind: ClusterSecretStore
        name: ""
      data: {}
    # Enricher-capable connector: forks pandoc/tesseract/pdftotext on
    # attacker-chosen attachments, so this cgroup is the ceiling on what a
    # hostile document can spend. Larger than the 200m/128Mi the API-only
    # connectors use, and larger on purpose -- see "Enricher containment"
    # at the top of this file for why a tighter limit was the wrong answer.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Per-connector override of the chart-wide runtimeClassName. Empty means
    # inherit; set it to a sandboxed runtime you have actually installed.
    runtimeClassName: ""
    state:
      size: 1Gi
      storageClass: ""
      existingClaim: ""
    nodeSelector: {}
    affinity: {}
    tolerations: []

  github:
    enabled: false
    image:
      repository: ghcr.io/leftathome/glovebox-github
      tag: latest
      pullPolicy: IfNotPresent
    config:
      rules:
        - match: "repo:myorg/myrepo"
          destination: dev-agent
          tags:
            source_type: vcs
            priority: normal
        - match: "event:push"
          destination: dev-agent
        - match: "event:pull_request"
          destination: dev-agent
