apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glovebox.fullname" . }}-config
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
data:
  config.json: |
    {
      "staging_dir": {{ .Values.config.stagingDir | quote }},
      "quarantine_dir": {{ .Values.config.quarantineDir | quote }},
      "audit_dir": {{ .Values.config.auditDir | quote }},
      "failed_dir": {{ .Values.config.failedDir | quote }},
      "agents_dir": {{ .Values.config.agentsDir | quote }},
      "shared_dir": {{ .Values.config.sharedDir | quote }},
      "agent_allowlist": {{ .Values.config.agentAllowlist | toJson }},
      "metrics_port": {{ .Values.config.metricsPort }},
      "watch_mode": {{ .Values.config.watchMode | quote }},
      "poll_interval_seconds": {{ .Values.config.pollIntervalSeconds }},
      "rules_file": "/etc/glovebox/rules.json",
      "scan_workers": {{ .Values.config.scanWorkers }},
      "scan_timeout_seconds": {{ .Values.config.scanTimeoutSeconds }},
      "scan_chunk_size_bytes": {{ .Values.config.scanChunkSizeBytes }},
      "ingest": {
        "enabled": {{ .Values.config.ingest.enabled }},
        "port": {{ .Values.config.ingest.port | int }},
        "max_body_bytes": {{ .Values.config.ingest.maxBodyBytes | int }},
        "max_metadata_bytes": {{ .Values.config.ingest.maxMetadataBytes | int }},
        "backpressure_threshold": {{ .Values.config.ingest.backpressureThreshold | int }},
        "request_timeout_seconds": {{ .Values.config.ingest.requestTimeoutSeconds | int }},
        {{- /*
          Spec 10 ingest.auth + spec 13 ingest.archives blocks. We emit
          snake_case keys explicitly to match internal/config IngestConfig's
          json tags; `toJson` on the values map would camelCase them and
          the Go side would silently drop every field. The chart-only
          gate keys (.enabled, .networkPolicy.recognizerNamespaceLabel)
          are intentionally NOT projected here -- they decide whether
          sibling templates render but the binary never reads them.
        */ -}}
        "auth": {
          "enabled": {{ .Values.ingest.auth.enabled }},
          "vault": {
            "addr": {{ .Values.ingest.auth.vault.addr | quote }},
            "k8s_role": {{ .Values.ingest.auth.vault.k8sRole | quote }},
            "kv_mount": {{ .Values.ingest.auth.vault.kvMount | quote }},
            "tokens_path": {{ .Values.ingest.auth.vault.tokensPath | quote }}
          },
          "reload_interval_seconds": {{ .Values.ingest.auth.reloadIntervalSeconds | int }},
          "trusted_proxy_cidrs": {{ .Values.ingest.auth.trustedProxyCIDRs | toJson }},
          "per_ip_rate_limit": {
            "window_seconds": {{ regexReplaceAll "[^0-9]" .Values.ingest.auth.perIPRateLimit.window "" | int }},
            "max_rejected": {{ .Values.ingest.auth.perIPRateLimit.maxRejected | int }},
            "lru_capacity": {{ .Values.ingest.auth.perIPRateLimit.lruCapacity | int }}
          },
          "global_rate_limit": {
            "window_seconds": {{ regexReplaceAll "[^0-9]" .Values.ingest.auth.globalRateLimit.window "" | int }},
            "max_rejected": {{ .Values.ingest.auth.globalRateLimit.maxRejected | int }}
          }
        },
        "archives": {
          "enabled": {{ .Values.ingest.archives.enabled }},
          "staging_root": {{ .Values.ingest.archives.stagingRoot | quote }},
          "max_upload_size": {{ .Values.ingest.archives.maxUploadSize | int }},
          "per_source_max_concurrent": {{ .Values.ingest.archives.perSourceMaxConcurrent | int }},
          "global_max_concurrent": {{ .Values.ingest.archives.globalMaxConcurrent | int }},
          "per_source_soft_cap_pct": {{ .Values.ingest.archives.perSourceSoftCapPct | int }},
          "global_hard_cap_pct": {{ .Values.ingest.archives.globalHardCapPct | int }},
          "global_hard_cap_hysteresis_pct": {{ .Values.ingest.archives.globalHardCapHysteresisPct | int }},
          "patch_idle_timeout_seconds": {{ .Values.ingest.archives.patchIdleTimeoutSeconds | int }},
          "cleanup_interval_seconds": {{ .Values.ingest.archives.cleanupIntervalSeconds | int }},
          "cleanup_tmp_age_hours": {{ .Values.ingest.archives.cleanupTmpAgeHours | int }},
          "cleanup_finalize_age_hours": {{ .Values.ingest.archives.cleanupFinalizeAgeHours | int }},
          "done_retention_days": {{ .Values.ingest.archives.retention.doneArchiveDays | int }}
        }
      }
    }
  rules.json: |
    {{- .Files.Get "rules.json" | nindent 4 }}
