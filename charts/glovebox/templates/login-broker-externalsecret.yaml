{{- range $name, $b := .Values.loginBrokers }}
{{- if and $b $b.enabled (not ($b.credentials | default dict).existingSecret) }}
{{- $ctx := dict "name" $name "broker" $b "root" $ }}
---
# Account credentials for the "{{ $name }}" login broker, pulled from Vault
# into the Secret its Deployment reads key by key. Not rendered when
# loginBrokers.{{ $name }}.credentials.existingSecret names a Secret that
# already holds them.
#
# One per broker. Brokers never share a credentials Secret: a pod can only
# be handed the Secret its own Deployment names, and each Deployment names
# its own.
#
# There is deliberately no ExternalSecret here for the SESSION. The
# connector's own (connectors.<name>.externalSecret.files) already syncs the
# session the broker writes into the file the connector mounts; two
# ExternalSecrets owning one Secret would fight.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.loginBrokerName" $ctx }}-credentials
  labels:
    {{- include "glovebox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: login-broker
    glovebox.io/login-broker: {{ $name }}
spec:
  refreshInterval: {{ $b.vault.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ ($b.vault.secretStoreRef | default dict).kind | default "ClusterSecretStore" }}
    name: {{ required (printf "loginBrokers.%s.vault.secretStoreRef.name is required unless credentials.existingSecret is set" $name) ($b.vault.secretStoreRef | default dict).name | quote }}
  target:
    name: {{ include "glovebox.loginBrokerName" $ctx }}-credentials
    creationPolicy: Owner
  data:
    {{- range $secretKey, $property := $b.vault.credentialsProperties }}
    {{- if $property }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ required (printf "loginBrokers.%s.vault.credentialsPath is required unless credentials.existingSecret is set" $name) $b.vault.credentialsPath | quote }}
        property: {{ $property | quote }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
