{{- if .Values.ingest.auth.enabled }}
# Example ExternalSecret pulling the recognizer's bearer token from Vault
# (spec 10 §3.3 + §9). Operator-facing: replicate this resource per consumer
# source-id by adjusting metadata.name + remoteRef.key. The Vault path
# `secret/glovebox/ingest-tokens/<source-id>` is defined in spec 10 §3.1.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.fullname" . }}-ingest-token-recognizer
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  # ESO's refreshInterval is INDEPENDENT of glovebox's in-process
  # TokenStore reload cadence (.Values.ingest.auth.reloadIntervalSeconds,
  # default 300s per spec 10 §9). The two timers feed two distinct
  # caches: ESO refreshes the K8s Secret from Vault; glovebox reloads
  # its in-memory token slice from the projected Secret (or SIGHUP).
  # Setting ESO to 1m means a rotated Vault entry reaches the Secret
  # within 60s; the in-process reload then picks it up within
  # reloadIntervalSeconds.
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-default
  target:
    name: {{ include "glovebox.fullname" . }}-ingest-token-recognizer
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: glovebox/ingest-tokens/recognizer
        property: token
{{- end }}
