{{- if .Values.schoologyConnector.enabled }}
# Schoology connector Service.
#
# Exposes the framework health/metrics port and the trigger listener
# (POST /v1/poll, on HealthPort+1) for in-cluster callers that want to
# force an immediate poll outside the configured windows (spec 12 §6).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glovebox.fullname" . }}-schoology
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: schoology
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.schoologyConnector.healthPort | default 8080 }}
      targetPort: health
      protocol: TCP
      name: health
    - port: {{ add (.Values.schoologyConnector.healthPort | default 8080) 1 }}
      targetPort: trigger
      protocol: TCP
      name: trigger
  selector:
    {{- include "glovebox.connectorSelectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "connector" "schoology") | nindent 4 }}
{{- end }}
