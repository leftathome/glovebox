{{- if .Values.ingest.archives.enabled }}
{{- if not .Values.persistence.archiveStorage.existingClaim }}
# Spec 13 §5.1 storage PVC for both in-flight uploads (.tmp-archives/)
# and finalized archives (archives/). One PVC for both subtrees is the
# recommended layout (spec 13 §5.2 + the listener's st_dev check):
# every CSI provisioner with per-volume block devices (Longhorn, Rook
# block, etc.) gives each PVC its own filesystem, which would break
# the os.Rename-based atomic finalize between the two. A single PVC
# mounted at stagingRoot resolves it; the listener creates the two
# subdirs at boot via os.MkdirAll.
#
# Size to cover the worst-case concurrent upload set (tmp) plus the
# done-retention window's worth of finalized archives (final). The
# cleanup goroutine sweeps tmp after CleanupTmpAgeHours and done
# archives after DoneRetentionDays (spec 13 §5.5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "glovebox.fullname" . }}-archive-storage
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.archiveStorage.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.archiveStorage.size }}
  {{- if .Values.persistence.archiveStorage.storageClass }}
  storageClassName: {{ .Values.persistence.archiveStorage.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
