apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glovebox.fullname" . }}
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "glovebox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glovebox.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.annotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      serviceAccountName: {{ include "glovebox.serviceAccountName" . }}
      {{- with (include "glovebox.runtimeClassName" (dict "workload" dict "root" .)) }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- with (include "glovebox.seccompProfile" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      containers:
        - name: glovebox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - --config
            - /etc/glovebox/config.json
          {{- if or .Values.ingest.auth.enabled .Values.ingest.archives.enabled }}
          env:
            {{- if .Values.ingest.auth.vault.tlsSkipVerify }}
            # Explicitly disabled verification. Prefer vault.caSecret: the
            # token-retrieval path is how glovebox learns which callers to
            # trust, so an unauthenticated connection there undermines
            # every check that depends on those tokens.
            - name: VAULT_SKIP_VERIFY
              value: "true"
            {{- else if .Values.ingest.auth.vault.caSecret }}
            # Verify against the operator-supplied CA bundle. The vault Go
            # client (used by auth.LoginK8s + auth.NewProductionVaultClient)
            # reads VAULT_CACERT from env via vaultapi.DefaultConfig.
            - name: VAULT_CACERT
              value: /etc/vault-ca/ca.crt
            {{- end }}
            {{- if .Values.ingest.archives.enabled }}
            # Pin the Go runtime's soft memory ceiling ~100Mi below the
            # cgroup limit so GC self-throttles before the kernel
            # OOM-kills the pod during sustained multi-GiB PATCH
            # streams (glovebox-5ud9). Go 1.19+ reads GOMEMLIMIT;
            # format accepts e.g. "1900MiB". Value derived as
            # resources.limits.memory minus a 100Mi safety margin.
            - name: GOMEMLIMIT
              value: "1900MiB"
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- if .Values.config.ingest.enabled }}
            {{- if include "glovebox.ingestPortServed" . }}
            - name: ingest
              containerPort: {{ .Values.config.ingest.port }}
              protocol: TCP
            {{- end }}
            {{- if include "glovebox.bearerPortServed" . }}
            - name: ingest-bearer
              containerPort: {{ include "glovebox.bearerPort" . }}
              protocol: TCP
            {{- end }}
            {{- if ne .Values.ingest.tls.mode "disabled" }}
            - name: ingest-tls
              containerPort: {{ .Values.ingest.tls.port }}
              protocol: TCP
            {{- end }}
            {{- end }}
          # /healthz actively probes that the delivery mount is writable, so a
          # stale bind-mount EIO on the shared agents PVC restarts the pod
          # instead of silently stalling delivery (a tcpSocket probe cannot see
          # a dead filesystem). Matches the connector deployments' health surface.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- if .Values.config.ingest.enabled }}
          {{- /*
            Probe a port the process actually binds. Under
            ingest.tls.mode=required the plaintext /v1/ingest listener is
            never opened, so a tcpSocket probe on `ingest` could only ever
            be answered by a bearer listener that happens to share the
            port -- and was answered by nothing at all when the bearer
            endpoints were off, killing the pod after failureThreshold.
            The mTLS listener is the one that is always up in that mode; a
            tcpSocket probe completes the TCP handshake and never speaks
            TLS, so it needs no client certificate.
          */}}
          startupProbe:
            tcpSocket:
              port: {{ if eq .Values.ingest.tls.mode "required" }}ingest-tls{{ else }}ingest{{ end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/glovebox
              readOnly: true
            {{- if ne .Values.ingest.tls.mode "disabled" }}
            - name: ingest-tls
              mountPath: /etc/ingest-tls
              readOnly: true
            {{- end }}
            {{- if and .Values.ingest.auth.enabled .Values.ingest.auth.vault.caSecret (not .Values.ingest.auth.vault.tlsSkipVerify) }}
            - name: vault-ca
              mountPath: /etc/vault-ca
              readOnly: true
            {{- end }}
            {{- if ne .Values.rules.signing.mode "disabled" }}
            # The ruleset trust anchor, mounted from its OWN Secret rather
            # than the rules ConfigMap. Same object would mean an attacker
            # with configmap-edit swapping the key and the rules together.
            - name: rules-signing-key
              mountPath: /etc/glovebox-rules-key
              readOnly: true
            {{- end }}
            - name: staging
              mountPath: {{ .Values.config.stagingDir }}
            - name: quarantine
              mountPath: {{ .Values.config.quarantineDir }}
            - name: audit
              mountPath: {{ .Values.config.auditDir }}
            - name: failed
              mountPath: {{ .Values.config.failedDir }}
            - name: agents
              mountPath: {{ .Values.config.agentsDir }}
            - name: shared
              mountPath: {{ .Values.config.sharedDir }}
            {{- if .Values.ingest.archives.enabled }}
            # Spec 13 §5.2 — mount ONE PVC at stagingRoot; the listener
            # creates .tmp-archives/ and archives/ subdirs on first boot.
            # A single PVC guarantees st_dev identity (the listener's
            # safety check would 503 the endpoint otherwise on backends
            # like Longhorn where each PVC is a separate block device).
            - name: archive-storage
              mountPath: {{ .Values.ingest.archives.stagingRoot }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "glovebox.fullname" . }}-config
        {{- if ne .Values.ingest.tls.mode "disabled" }}
        # cert-manager writes tls.crt/tls.key here and, for a CA issuer,
        # ca.crt -- which is what client certificates are verified against.
        - name: ingest-tls
          secret:
            secretName: {{ include "glovebox.fullname" . }}-ingest-server-tls
        {{- end }}
        {{- if and .Values.ingest.auth.enabled .Values.ingest.auth.vault.caSecret (not .Values.ingest.auth.vault.tlsSkipVerify) }}
        - name: vault-ca
          secret:
            secretName: {{ .Values.ingest.auth.vault.caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if ne .Values.rules.signing.mode "disabled" }}
        {{- if not .Values.rules.signing.publicKeySecret }}
        {{- fail "rules.signing.mode is enabled but rules.signing.publicKeySecret is empty: there would be nothing to verify against and the pod would refuse every ruleset at boot. Create the Secret first (see docs/rule-signing.md)." }}
        {{- end }}
        - name: rules-signing-key
          secret:
            secretName: {{ .Values.rules.signing.publicKeySecret }}
            items:
              - key: {{ .Values.rules.signing.publicKeySecretKey }}
                path: {{ .Values.rules.signing.publicKeySecretKey }}
        {{- end }}
        - name: staging
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.staging.existingClaim | default (printf "%s-staging" (include "glovebox.fullname" .)) }}
        - name: quarantine
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.quarantine.existingClaim | default (printf "%s-quarantine" (include "glovebox.fullname" .)) }}
        - name: audit
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.audit.existingClaim | default (printf "%s-audit" (include "glovebox.fullname" .)) }}
        - name: failed
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.failed.existingClaim | default (printf "%s-failed" (include "glovebox.fullname" .)) }}
        - name: agents
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.agents.existingClaim | default (printf "%s-agents" (include "glovebox.fullname" .)) }}
        - name: shared
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.shared.existingClaim | default (printf "%s-shared" (include "glovebox.fullname" .)) }}
        {{- if .Values.ingest.archives.enabled }}
        - name: archive-storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.archiveStorage.existingClaim | default (printf "%s-archive-storage" (include "glovebox.fullname" .)) }}
        {{- end }}
