{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.serviceAccountName" . }}
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
  The core's ServiceAccount. Connectors and importers have their own
  (connector-serviceaccount.yaml, importer-serviceaccount.yaml); nothing
  else runs as this one. The token is mounted only with ingest.auth.enabled:
  the archive listener (spec 13) logs in to Vault with Kubernetes auth, which
  reads the projected token at
  /var/run/secrets/kubernetes.io/serviceaccount/token. The core Deployment
  states the same value on its pod spec.
*/}}
automountServiceAccountToken: {{ .Values.ingest.auth.enabled | default false }}
{{- end }}
