{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.serviceAccountName" . }}
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
  Token automounting is OFF by default to keep blast radius small for
  the scanner + connector pods that don't need K8s API access. The
  archive listener (spec 13) uses Vault K8s auth which requires the
  projected SA token at /var/run/secrets/kubernetes.io/serviceaccount/token;
  flip to true when ingest.auth.enabled is on.
*/}}
automountServiceAccountToken: {{ .Values.ingest.auth.enabled | default false }}
{{- end }}
