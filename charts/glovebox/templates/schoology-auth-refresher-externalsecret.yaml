{{- if .Values.schoologyAuthRefresher.enabled }}
# ExternalSecret #1: Schoology source credentials.
#
# Pulls username/password/host from a Vault KV v2 path and materializes
# them into the K8s Secret the refresher CronJob projects via envFrom.
# Field names match the SCHOOLOGY_* env vars the binary reads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.fullname" . }}-schoology-refresher-credentials
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: schoology-auth-refresher
spec:
  refreshInterval: {{ .Values.schoologyAuthRefresher.vault.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    kind: {{ .Values.schoologyAuthRefresher.vault.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.schoologyAuthRefresher.vault.secretStoreRef.name | quote }}
  target:
    name: {{ include "glovebox.fullname" . }}-schoology-refresher-credentials
    creationPolicy: Owner
  data:
    - secretKey: SCHOOLOGY_HOST
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.credentialsPath | quote }}
        property: host
    - secretKey: SCHOOLOGY_USERNAME
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.credentialsPath | quote }}
        property: username
    - secretKey: SCHOOLOGY_PASSWORD
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.credentialsPath | quote }}
        property: password
---
# ExternalSecret #2: Schoology session JSON (5 fields).
#
# Pulls the live session that the refresher writes back into Vault and
# materializes it into the K8s Secret the Schoology CONNECTOR pod
# consumes (not the refresher itself). The connector Deployment carries
# a checksum annotation against this Secret so the pod auto-rolls when
# the session changes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.fullname" . }}-schoology-session
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: schoology-auth-refresher
spec:
  refreshInterval: {{ .Values.schoologyAuthRefresher.vault.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    kind: {{ .Values.schoologyAuthRefresher.vault.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.schoologyAuthRefresher.vault.secretStoreRef.name | quote }}
  target:
    name: {{ include "glovebox.fullname" . }}-schoology-session
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Single-file form: the connector mounts this Secret at
        # /etc/schoology/credentials.json and uses auth.LoadCredentials.
        credentials.json: |
          {
            "host": "{{ "{{ .host }}" }}",
            "sess_id": "{{ "{{ .sess_id }}" }}",
            "csrf_token": "{{ "{{ .csrf_token }}" }}",
            "csrf_key": "{{ "{{ .csrf_key }}" }}",
            "uid": "{{ "{{ .uid }}" }}"
          }
  data:
    - secretKey: host
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.sessionPath | quote }}
        property: host
    - secretKey: sess_id
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.sessionPath | quote }}
        property: sess_id
    - secretKey: csrf_token
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.sessionPath | quote }}
        property: csrf_token
    - secretKey: csrf_key
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.sessionPath | quote }}
        property: csrf_key
    - secretKey: uid
      remoteRef:
        key: {{ .Values.schoologyAuthRefresher.vault.sessionPath | quote }}
        property: uid
{{- end }}
