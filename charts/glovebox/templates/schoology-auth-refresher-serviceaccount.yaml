{{- if .Values.schoologyAuthRefresher.enabled }}
# Dedicated ServiceAccount whose projected JWT is consumed by Vault's
# Kubernetes auth method (role: {{ .Values.schoologyAuthRefresher.vault.k8sRole }}).
# The token must be automounted so the vault-go client can read it from
# the default projected path inside the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.fullname" . }}-schoology-auth-refresher
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: schoology-auth-refresher
{{- end }}
