{{- if .Values.ingest.archives.enabled }}
# Grants the recognizer namespace TCP/9091 ingress to the glovebox scanner
# pods so it can drive the /v1/archives tus.io upload endpoint (spec 13 §8.1).
# Future archive-delivery clients (workstation mbox importer, friend imports)
# will need their own ingress rules; not in scope here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "glovebox.fullname" . }}-archive-ingress
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  podSelector:
    matchLabels:
      {{- include "glovebox.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingest.archives.networkPolicy.recognizerNamespaceLabel }}
      ports:
        - protocol: TCP
          port: 9091
{{- end }}
