{{- if .Values.powerschoolAuthRefresher.enabled }}
# Dedicated ServiceAccount whose projected JWT is consumed by Vault's
# Kubernetes auth method (role: {{ .Values.powerschoolAuthRefresher.vault.k8sRole }}).
# The Vault role must be bound to exactly this name and namespace; nothing
# else in the chart uses it. The token must be automounted so the Vault
# client can read it from the default projected path inside the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.fullname" . }}-powerschool-auth-refresher
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: powerschool-auth-refresher
automountServiceAccountToken: true
{{- end }}
