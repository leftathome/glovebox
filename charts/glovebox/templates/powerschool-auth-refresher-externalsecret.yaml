{{- if and .Values.powerschoolAuthRefresher.enabled (not (.Values.powerschoolAuthRefresher.credentials | default dict).existingSecret) }}
{{- $r := .Values.powerschoolAuthRefresher }}
# PowerSchool account credentials for the login job.
#
# Pulls the portal hostname, username and password from Vault into the
# Secret the CronJobs read key by key. Not rendered when
# powerschoolAuthRefresher.credentials.existingSecret names a Secret that
# already holds them.
#
# There is deliberately no second ExternalSecret here for the SESSION, unlike
# schoology-auth-refresher-externalsecret.yaml. The PowerSchool connector is
# deployed through the generic connectors map, which already renders the
# ExternalSecret for the Secret it mounts:
# connectors.powerschool.externalSecret.files -> <fullname>-powerschool-files,
# key session.json, from property "session" of the path this job writes
# (powerschoolAuthRefresher.vault.sessionPath). Two ExternalSecrets owning one
# Secret would fight; the CronJob template fails the render when the two
# paths disagree.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.fullname" . }}-powerschool-refresher-credentials
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: powerschool-auth-refresher
spec:
  refreshInterval: {{ $r.vault.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $r.vault.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ required "powerschoolAuthRefresher.vault.secretStoreRef.name is required unless credentials.existingSecret is set" $r.vault.secretStoreRef.name | quote }}
  target:
    name: {{ include "glovebox.fullname" . }}-powerschool-refresher-credentials
    creationPolicy: Owner
  data:
    - secretKey: {{ $r.credentials.keys.hostname | quote }}
      remoteRef:
        key: {{ $r.vault.credentialsPath | quote }}
        property: {{ ((.Values.powerschoolAuthRefresher.vault.credentialsKeys | default dict).hostname) | default "powerschool_hostname" | quote }}
    - secretKey: {{ $r.credentials.keys.username | quote }}
      remoteRef:
        key: {{ $r.vault.credentialsPath | quote }}
        property: {{ ((.Values.powerschoolAuthRefresher.vault.credentialsKeys | default dict).username) | default "powerschool_username" | quote }}
    - secretKey: {{ $r.credentials.keys.password | quote }}
      remoteRef:
        key: {{ $r.vault.credentialsPath | quote }}
        property: {{ ((.Values.powerschoolAuthRefresher.vault.credentialsKeys | default dict).password) | default "powerschool_password" | quote }}
{{- end }}
