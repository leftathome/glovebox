{{- $d := .Values.journal.database }}
{{- $es := $d.externalSecret | default dict }}
{{- if and .Values.journal.enabled (not $d.existingSecret) $es.enabled }}
# The journal's database credentials, pulled from Vault into the Secret the
# core mounts (deployment.yaml, volume journal-db: these two keys only, mode
# 0400). Not rendered when journal.database.existingSecret names a Secret
# that already holds them. The values never pass through Helm.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.journalDBSecret" . }}
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: journal
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ ($es.secretStoreRef | default dict).kind | default "ClusterSecretStore" }}
    name: {{ required "journal.database.externalSecret.secretStoreRef.name is required" ($es.secretStoreRef | default dict).name | quote }}
  target:
    name: {{ include "glovebox.journalDBSecret" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "journal.database.externalSecret.path is required" $es.path | quote }}
        property: {{ $es.usernameProperty | default "username" | quote }}
    - secretKey: password
      remoteRef:
        key: {{ $es.path | quote }}
        property: {{ $es.passwordProperty | default "password" | quote }}
{{- end }}
