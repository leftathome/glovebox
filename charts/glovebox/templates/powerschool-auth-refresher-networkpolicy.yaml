{{- $r := .Values.powerschoolAuthRefresher }}
{{- if and $r.enabled .Values.networkPolicy.enabled ($r.networkPolicy | default dict).enabled }}
# Egress for the PowerSchool login job's pods, which hold a parent account's
# username and password: cluster DNS, Vault, and the portal over https.
# Nothing may connect to them.
#
# The chart has no such policy for the Schoology refresher (its pods fall
# under no NetworkPolicy of this chart at all). This is new with this job,
# not a copy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "glovebox.fullname" . }}-powerschool-auth-refresher
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: powerschool-auth-refresher
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "glovebox.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: powerschool-auth-refresher
  policyTypes:
    - Egress
    - Ingress
  ingress: []
  egress:
    {{- with .Values.networkPolicy.dns }}
    {{- if .enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.vault.namespace }}
    # Vault (Kubernetes auth login, session and state read and write): the
    # Vault pods and port only, not the whole namespace. A Vault outside
    # the cluster: set networkPolicy.vault.namespace to "" and allow it
    # through powerschoolAuthRefresher.networkPolicy.extraEgress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.vault.namespace }}
          {{- with $r.networkPolicy.vaultPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.vault.port }}
          protocol: TCP
    {{- end }}
    {{- if ($r.onRequest | default dict).enabled }}
    {{- if not $r.networkPolicy.kubernetesAPICIDRs }}
    {{- fail "powerschoolAuthRefresher.onRequest.enabled with this NetworkPolicy needs powerschoolAuthRefresher.networkPolicy.kubernetesAPICIDRs: the on-request runs read the login request from the Kubernetes API, which this policy would otherwise cut off (the API server's addresses are private, and private ranges are excluded from the 443 rule). List the control-plane addresses (kubectl get endpoints kubernetes -n default) and the kubernetes Service's cluster IP, each as a /32; or set powerschoolAuthRefresher.networkPolicy.enabled=false" }}
    {{- end }}
    # The Kubernetes API server, to read the connector's login request (one
    # GET of one ConfigMap). Addresses, because the API server is not a pod
    # a selector could match.
    - to:
        {{- range $r.networkPolicy.kubernetesAPICIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range ($r.networkPolicy.kubernetesAPIPorts | default (list 443 6443)) }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    # The portal, https only. A NetworkPolicy selects addresses, not names,
    # so this is "the public internet on 443": private, CGNAT and link-local
    # ranges -- where the cluster's own pods and services and the LAN live --
    # are carved out of the catch-all, so the browser cannot be pointed at
    # an in-cluster https service.
    - to:
        {{- range $r.networkPolicy.portalCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- if and (eq (toString .) "0.0.0.0/0") $r.networkPolicy.portalExceptCIDRs }}
            except:
              {{- toYaml $r.networkPolicy.portalExceptCIDRs | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- with $r.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
