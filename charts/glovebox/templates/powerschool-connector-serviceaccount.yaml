{{- $conn := (.Values.connectors | default dict).powerschool | default dict }}
{{- if and $conn.enabled ($conn.loginOnDemand | default dict).enabled }}
# ServiceAccount of the PowerSchool connector, rendered only with
# connectors.powerschool.loginOnDemand. Every other connector shares the
# chart's ServiceAccount and has no token mounted; this one talks to the
# Kubernetes API (to write its login request into one ConfigMap) and gets
# an identity that can do that and nothing else: see
# powerschool-connector-role.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.fullname" . }}-powerschool
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: powerschool
# Mounted by the Deployment's pod spec, explicitly; not by default.
automountServiceAccountToken: false
{{- end }}
