{{- $conn := (.Values.connectors | default dict).powerschool | default dict }}
{{- if and $conn.enabled (or ($conn.loginOnDemand | default dict).enabled ($conn.loginBroker | default dict).enabled) }}
# ServiceAccount of the PowerSchool connector, rendered only with
# connectors.powerschool.loginOnDemand or .loginBroker. Every other
# connector shares the chart's ServiceAccount and has no token mounted.
#
#   loginOnDemand  this one talks to the Kubernetes API (to write its login
#                  request into one ConfigMap) and gets an identity that can
#                  do that and nothing else: powerschool-connector-role.yaml.
#   loginBroker    this one is the identity the login broker allow-lists.
#                  It has no Role and no RoleBinding: it can do nothing in
#                  the API, and its API token is not mounted. The pod holds
#                  only a token projected for the broker's audience.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.fullname" . }}-powerschool
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: powerschool
# Mounted by the Deployment's pod spec, explicitly; not by default.
automountServiceAccountToken: false
{{- end }}
