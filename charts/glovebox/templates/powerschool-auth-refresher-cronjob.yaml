{{- if .Values.powerschoolAuthRefresher.enabled }}
{{- /*
PowerSchool session login job (spec 16 section 4).

One CronJob per entry of powerschoolAuthRefresher.schedules, all running the
same image with the same settings bar the schedule and POWERSCHOOL_MIN_SESSION_AGE.
Each run logs in to the parent portal at most once and writes the session to
Vault KV v2; ESO syncs it into the Secret the PowerSchool connector mounts.

The account is its owner's own and the portal keeps one live session per
account, so a login ends whatever session existed. Hence, on top of what the
binary enforces by itself (no login inside the blackout; no login while the
stored session is young and still accepted; one login per run):

  - the render fails for a schedule that can fire inside the blackout
    (glovebox.powerschoolScheduleCheck);
  - startingDeadlineSeconds keeps a missed run from starting hours late;
  - backoffLimit 0 and restartPolicy Never: a failed run is not repeated.
    The next scheduled run is the retry. (schoology-auth-refresher retries
    three times; that account is not shared with a person.)
  - concurrencyPolicy Forbid.
*/}}
{{- $r := .Values.powerschoolAuthRefresher }}
{{- $fullname := include "glovebox.fullname" . }}
{{- if and $r.vault.statePath (eq (trimAll "/" (toString $r.vault.statePath)) (trimAll "/" (toString $r.vault.sessionPath))) }}
{{- fail "powerschoolAuthRefresher.vault.statePath must not be the session path: the session secret is what ESO copies to the connector" }}
{{- end }}
{{- if not (hasPrefix "https://" (lower (toString $r.vault.addr))) }}
{{- fail "powerschoolAuthRefresher.vault.addr must be an https URL: the login job sends the session and its ServiceAccount token to Vault and refuses a plaintext address" }}
{{- end }}
{{- $active := dict }}
{{- range $name, $entry := $r.schedules }}
{{- if $entry }}
{{- $_ := set $active $name $entry }}
{{- end }}
{{- end }}
{{- $onRequest := $r.onRequest | default dict }}
{{- if and (not $active) (not $onRequest.enabled) }}
{{- fail "powerschoolAuthRefresher.enabled is true but powerschoolAuthRefresher.schedules is empty and onRequest is off: there would be no login workload" }}
{{- end }}
{{- /*
Every CronJob this template renders, of both kinds, as one list:

  schedule  an entry of `schedules`: runs on its clock (unless suspended)
            and logs in by the ordinary rules.
  request   an entry of `onRequest.windows`: runs every few minutes inside
            a window and does nothing -- sends nothing to the portal --
            unless the connector has written a login request.

They share one pod template. What differs is in $e.
*/}}
{{- $entries := dict }}
{{- range $name, $entry := $active }}
{{- $_ := set $entries (printf "0/%s" $name) (dict
      "kind" "schedule" "name" $name
      "cronName" (printf "%s-powerschool-login-%s" $fullname $name)
      "where" (printf "powerschoolAuthRefresher.schedules.%s" $name)
      "schedule" $entry.schedule
      "minSessionAge" $entry.minSessionAge
      "suspend" (or $r.suspendSchedules $entry.suspend)
      "deadline" $r.startingDeadlineSeconds) }}
{{- end }}
{{- if $onRequest.enabled }}
{{- $windows := dict }}
{{- range $name, $schedule := $onRequest.windows }}
{{- if $schedule }}
{{- $_ := set $windows $name $schedule }}
{{- end }}
{{- end }}
{{- if not $windows }}
{{- fail "powerschoolAuthRefresher.onRequest.enabled is true but onRequest.windows is empty: the connector's login requests would never be read" }}
{{- end }}
{{- if lt (int ($onRequest.minIntervalMinutes | default 20)) 20 }}
{{- fail "powerschoolAuthRefresher.onRequest.minIntervalMinutes must be at least 20: it bounds how often a login can be caused through the request ConfigMap" }}
{{- end }}
{{- if lt (int ($onRequest.maxRequestAgeMinutes | default 15)) 1 }}
{{- fail "powerschoolAuthRefresher.onRequest.maxRequestAgeMinutes must be at least 1" }}
{{- end }}
{{- range $name, $schedule := $windows }}
{{- $_ := set $entries (printf "1/%s" $name) (dict
      "kind" "request" "name" $name
      "cronName" (printf "%s-powerschool-login-req-%s" $fullname $name)
      "where" (printf "powerschoolAuthRefresher.onRequest.windows.%s" $name)
      "schedule" $schedule
      "minSessionAge" ($onRequest.minSessionAge | default "5m")
      "suspend" false
      "deadline" ($onRequest.startingDeadlineSeconds | default 120)) }}
{{- end }}
{{- end }}
{{- /*
The connector must be handed the session this job writes. When both are
enabled and the connector takes its session from an ExternalSecret, the two
paths have to be the same one.
*/}}
{{- $conn := (.Values.connectors | default dict).powerschool | default dict }}
{{- $connES := $conn.externalSecret | default dict }}
{{- if and $conn.enabled $connES.enabled }}
{{- $sessionRef := index (($connES.files | default dict).data | default dict) "session.json" | default dict }}
{{- if $sessionRef }}
{{- if or (ne (toString $sessionRef.key) (toString $r.vault.sessionPath)) (ne (toString $sessionRef.property) "session") }}
{{- fail (printf "connectors.powerschool.externalSecret.files.data.\"session.json\" reads %q property %q, but the login job writes powerschoolAuthRefresher.vault.sessionPath %q property \"session\": the connector would never receive the session" (toString $sessionRef.key) (toString $sessionRef.property) (toString $r.vault.sessionPath)) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $e := $entries }}
{{- $name := $e.name }}
{{- $isRequest := eq $e.kind "request" }}
{{- include "glovebox.powerschoolScheduleCheck" (dict "name" $name "where" $e.where "schedule" $e.schedule "deadline" $e.deadline "root" $) }}
{{- $cronName := $e.cronName }}
{{- if gt (len $cronName) 52 }}
{{- fail (printf "CronJob name %q is %d characters; the limit is 52. Shorten the key %q (%s) or set fullnameOverride" $cronName (len $cronName) $name $e.where) }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cronName }}
  labels:
    {{- include "glovebox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: powerschool-auth-refresher
    {{- if $isRequest }}
    glovebox.io/powerschool-login-request-window: {{ $name | quote }}
    {{- else }}
    glovebox.io/powerschool-login-schedule: {{ $name | quote }}
    {{- end }}
spec:
  schedule: {{ $e.schedule | quote }}
  # Kubernetes 1.27+. Without it the schedule would be read in the
  # controller's zone (usually UTC) and "0 5" would be 21:00 or 22:00 Pacific.
  timeZone: {{ $r.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ int $e.deadline }}
  {{- if $e.suspend }}
  # No scheduled runs. The CronJob remains as the template an operator
  # makes a manual run from (kubectl create job --from=cronjob/...).
  suspend: true
  {{- end }}
  {{- if $isRequest }}
  # These run every few minutes and almost always have nothing to do.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  {{- else }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        # On every login Job, however it was started: the controller copies
        # these to scheduled Jobs and kubectl to manual ones.
        #   kubectl get jobs -l glovebox.io/powerschool-login=true
        glovebox.io/powerschool-login: "true"
        glovebox.io/powerschool-login-kind: {{ $e.kind | quote }}
        app.kubernetes.io/name: {{ include "glovebox.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: powerschool-auth-refresher
    spec:
      # Never retried: every pod is a login to a real parent account.
      backoffLimit: 0
      activeDeadlineSeconds: 600
      # An hour, not days: a finished pod is of no further use once its log
      # has been shipped, and its termination message says how it ended.
      # Ten minutes for the on-request runs, which are frequent.
      ttlSecondsAfterFinished: {{ ternary 600 3600 $isRequest }}
      template:
        metadata:
          labels:
            {{- include "glovebox.labels" $ | nindent 12 }}
            app.kubernetes.io/component: powerschool-auth-refresher
        spec:
          serviceAccountName: {{ $fullname }}-powerschool-auth-refresher
          restartPolicy: Never
          {{- with (include "glovebox.runtimeClassName" (dict "workload" $r "root" $)) }}
          runtimeClassName: {{ . | quote }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            {{- with (include "glovebox.seccompProfile" $) }}
            {{- . | nindent 12 }}
            {{- else }}
            # The chart-wide profile was switched off. This pod runs a
            # browser and is not left unconfined on that account.
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
          containers:
            - name: refresher
              image: "{{ $r.image.repository }}:{{ $r.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $r.image.pullPolicy | default "IfNotPresent" }}
              securityContext:
                # Read-only root. Everything Chromium and the binary write
                # goes to the three memory-backed emptyDirs below (/tmp,
                # $HOME, /dev/shm), so the browser profile -- which holds
                # the session cookies -- never reaches a node's disk.
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop:
                    - ALL
              # The binary writes one line here on every exit: the outcome
              # and why. `kubectl describe pod` shows it.
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              env:
                - name: TMPDIR
                  value: /tmp
                - name: HOME
                  value: /home/refresher
                # The account. Taken key by key, not envFrom, so nothing else
                # in that Secret reaches the process.
                - name: POWERSCHOOL_HOSTNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "glovebox.powerschoolRefresherCredentialsSecret" $ | quote }}
                      key: {{ $r.credentials.keys.hostname | quote }}
                - name: POWERSCHOOL_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "glovebox.powerschoolRefresherCredentialsSecret" $ | quote }}
                      key: {{ $r.credentials.keys.username | quote }}
                - name: POWERSCHOOL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "glovebox.powerschoolRefresherCredentialsSecret" $ | quote }}
                      key: {{ $r.credentials.keys.password | quote }}
                - name: VAULT_ADDR
                  value: {{ $r.vault.addr | quote }}
                - name: VAULT_K8S_ROLE
                  value: {{ $r.vault.k8sRole | quote }}
                - name: VAULT_KV_MOUNT
                  value: {{ $r.vault.kvMount | default "secret" | quote }}
                - name: VAULT_SESSION_PATH
                  value: {{ $r.vault.sessionPath | quote }}
                {{- with $r.vault.statePath }}
                - name: VAULT_STATE_PATH
                  value: {{ . | quote }}
                {{- end }}
                {{- with $r.vault.caConfigMap }}
                {{- if .name }}
                - name: VAULT_CACERT
                  value: /etc/vault-ca/{{ .key | default "ca.crt" }}
                {{- end }}
                {{- end }}
                # Enforced by the binary against the real clock. These can
                # only widen its built-in 16:00-21:00 America/Los_Angeles;
                # it refuses to start on anything else.
                - name: POWERSCHOOL_BLACKOUT_START
                  value: {{ $r.blackout.start | quote }}
                - name: POWERSCHOOL_BLACKOUT_END
                  value: {{ $r.blackout.end | quote }}
                - name: POWERSCHOOL_BLACKOUT_TZ
                  value: {{ $r.blackout.timeZone | quote }}
                {{- if $r.blackout.extraWindows }}
                {{- $extra := list }}
                {{- range $r.blackout.extraWindows }}
                {{- $extra = append $extra (printf "%s-%s" (toString .start) (toString .end)) }}
                {{- end }}
                - name: POWERSCHOOL_BLACKOUT_EXTRA
                  value: {{ join "," $extra | quote }}
                {{- end }}
                - name: POWERSCHOOL_MIN_SESSION_AGE
                  value: {{ required (printf "%s.minSessionAge is required" $e.where) $e.minSessionAge | quote }}
                {{- if $isRequest }}
                # Request mode: this run acts only when the connector has
                # written a login request, and otherwise sends nothing to
                # the portal. The interval is the bound on how often a
                # login can be caused through that ConfigMap; the binary
                # refuses a value under 20m.
                - name: POWERSCHOOL_LOGIN_REQUEST_CONFIGMAP
                  value: {{ printf "%s-powerschool-login-request" $fullname | quote }}
                - name: POWERSCHOOL_LOGIN_REQUEST_NAMESPACE
                  value: {{ $.Release.Namespace | quote }}
                - name: POWERSCHOOL_LOGIN_REQUEST_MIN_INTERVAL
                  value: {{ printf "%dm" (int ($onRequest.minIntervalMinutes | default 20)) | quote }}
                - name: POWERSCHOOL_LOGIN_REQUEST_MAX_AGE
                  value: {{ printf "%dm" (int ($onRequest.maxRequestAgeMinutes | default 15)) | quote }}
                {{- end }}
                - name: POWERSCHOOL_SESSION_LIFETIME
                  value: {{ $r.sessionLifetime | quote }}
              resources:
                {{- toYaml $r.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/refresher
                - name: dshm
                  mountPath: /dev/shm
                {{- with $r.vault.caConfigMap }}
                {{- if .name }}
                - name: vault-ca
                  mountPath: /etc/vault-ca
                  readOnly: true
                {{- end }}
                {{- end }}
          volumes:
            # Memory-backed, size-capped, gone with the pod.
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: {{ $r.tmpSizeLimit | default "256Mi" }}
            - name: home
              emptyDir:
                medium: Memory
                sizeLimit: {{ $r.homeSizeLimit | default "64Mi" }}
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: {{ $r.shmSizeLimit | default "256Mi" }}
            {{- with $r.vault.caConfigMap }}
            {{- if .name }}
            - name: vault-ca
              configMap:
                name: {{ .name | quote }}
            {{- end }}
            {{- end }}
{{- end }}
{{- end }}
