{{- /*
One ServiceAccount per connector Deployment, <fullname>-connector-<name>,
used by that connector's pods and by nothing else (glovebox-wekc.19).

A connector is an identity. The record journal authorises writes by
ServiceAccount (spec 2026-10-16, section 4.9c), and a connector that has been
taken over -- RSS parses whatever the open internet sends it -- must not be
able to act as another connector or as the core. Sharing one account made
that impossible to express.

No connector's API token is mounted by default, here or on its pod; the pod
spec states it explicitly as well. The exceptions, all PowerSchool:

  loginOnDemand  the connector writes its login request into one ConfigMap
                 through the Kubernetes API: its pod mounts the token, and
                 powerschool-connector-role.yaml grants this account exactly
                 get/update/patch on that ConfigMap and nothing else.
  loginBroker    the account is the identity the broker allow-lists. It has
                 no Role; the pod holds only a token projected for the
                 broker's audience, which the Kubernetes API refuses.

connectors.<name>.serviceAccount (and schoologyConnector.serviceAccount)
override the name, skip the object (create: false) or annotate it, as the
core's serviceAccount does.
*/}}
{{- $all := dict }}
{{- range $name, $c := .Values.connectors }}
{{- if and $c $c.enabled }}
{{- $_ := set $all $name $c }}
{{- end }}
{{- end }}
{{- if .Values.schoologyConnector.enabled }}
{{- $_ := set $all "schoology" .Values.schoologyConnector }}
{{- end }}
{{- range $name, $c := $all }}
{{- $ctx := dict "name" $name "connector" $c "root" $ }}
{{- if include "glovebox.connectorServiceAccountCreate" $ctx }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.connectorServiceAccountName" $ctx }}
  labels:
    {{- include "glovebox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: {{ $name }}
  {{- with ($c.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
