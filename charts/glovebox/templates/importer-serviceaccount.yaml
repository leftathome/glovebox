{{- /*
One ServiceAccount per enabled importer Job, <fullname>-importer-<name>,
used by that Job and nothing else (glovebox-wekc.19). Importers ingest
archives nobody vetted; like connectors they are producers with an identity
of their own, not the core's. None of them uses the Kubernetes API, so no
token is mounted. importers.<name>.serviceAccount overrides as for a
connector.
*/}}
{{- range $name, $imp := .Values.importers }}
{{- if and $imp $imp.enabled }}
{{- $sa := $imp.serviceAccount | default dict }}
{{- if or (not (hasKey $sa "create")) $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.importerServiceAccountName" (dict "name" $name "importer" $imp "root" $) }}
  labels:
    {{- include "glovebox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: importer
    glovebox.io/importer: {{ $name }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
