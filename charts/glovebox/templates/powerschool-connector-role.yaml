{{- $conn := (.Values.connectors | default dict).powerschool | default dict }}
{{- $lod := $conn.loginOnDemand | default dict }}
{{- if and $conn.enabled $lod.enabled }}
# Everything the PowerSchool connector may do through the Kubernetes API,
# for on-demand login (connectors.powerschool.loginOnDemand):
#
#   get     the one login CronJob, by name -- to copy its jobTemplate
#   create  Jobs                           -- to start the login workload
#   get     Jobs                           -- to see how its Job ended
#   list    Jobs                           -- to see whether a login Job
#                                             (scheduled or on demand) is
#                                             already running, so it never
#                                             starts a second one
#
# Kubernetes cannot restrict `create` or `list` to a resource name, so those
# two are namespace-wide for Jobs. Nothing else is granted: no pods, no
# secrets, no update or delete of anything. The Job this lets the connector
# create runs under the login workload's own ServiceAccount, which the
# connector cannot use; the connector gains no access to the account's
# credentials or to Vault by creating it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "glovebox.fullname" . }}-powerschool-login-on-demand
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: powerschool
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames:
      - {{ printf "%s-powerschool-login-%s" (include "glovebox.fullname" .) ($lod.schedule | default "morning") | quote }}
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
{{- end }}
