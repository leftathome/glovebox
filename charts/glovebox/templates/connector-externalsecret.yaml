{{- /*
Generic per-connector ExternalSecret (ESO). Rendered for any connector whose
externalSecret.enabled is true, materializing a Secret named
<fullname>-<connector>-secret from Vault (or whichever backend the referenced
SecretStore points at). The connector Deployment consumes that Secret via
envFrom when externalSecret.enabled (see connector-deployment.yaml), so the
connector reads its credentials as env vars -- the same mechanism schoology's
bespoke ExternalSecrets use, generalized to every connector.

values shape (per connector):
  externalSecret:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: ClusterSecretStore   # or SecretStore
      name: vault-default
    data:
      GITHUB_WEBHOOK_SECRET:               # -> Secret key / env var name
        key: secret/glovebox/github        # remote (Vault) path
        property: webhook_secret           # field within that path (optional)
*/}}
{{- range $name, $connector := .Values.connectors }}
{{- $es := $connector.externalSecret | default dict }}
{{- if and $connector.enabled $es.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "glovebox.fullname" $ }}-{{ $name }}-secret
  labels:
    {{- include "glovebox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: {{ $name }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ required (printf "connectors.%s.externalSecret.secretStoreRef.name is required when externalSecret.enabled" $name) $es.secretStoreRef.name | quote }}
  target:
    name: {{ include "glovebox.fullname" $ }}-{{ $name }}-secret
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := $es.data }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ required (printf "connectors.%s.externalSecret.data.%s.key is required" $name $secretKey) $ref.key | quote }}
        {{- if $ref.property }}
        property: {{ $ref.property | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
