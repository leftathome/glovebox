{{- if .Values.schoologyConnector.enabled }}
# Schoology connector config (spec 12). Rendered verbatim from
# .Values.schoologyConnector.config into config.json and mounted at
# /etc/connector/config.json. Operators MUST replace the placeholder
# schoology_uid values for each kid before enabling the connector.
#
# .Values.schoologyConnector.assignmentDetail is rendered into the
# assignment_detail block. An assignment_detail block written directly in
# .Values.schoologyConnector.config is kept, and wins key by key; the chart
# values fill in whatever it leaves out. The surface is off, and no block is
# rendered, while neither names a kid.
#
# Each enabled kid needs its own "schoology:<kid>:assignment_detail" rule in
# config.rules, placed before any "*" rule (rules are first-match-wins). The
# render fails otherwise, because the "*" rule would route a child's
# assignment text under the default subject. The connector refuses to start
# for the same reason.
{{- $cfg := deepCopy .Values.schoologyConnector.config }}
{{- $detail := .Values.schoologyConnector.assignmentDetail | default dict }}
{{- $user := $cfg.assignment_detail | default dict }}
{{- $ad := dict }}
{{- if $detail.kids }}{{- $_ := set $ad "kids" $detail.kids }}{{- end }}
{{- if $detail.maxPerPoll }}{{- $_ := set $ad "max_per_poll" (int $detail.maxPerPoll) }}{{- end }}
{{- if $detail.refreshHours }}{{- $_ := set $ad "refresh_hours" (int $detail.refreshHours) }}{{- end }}
{{- if $detail.requestSpacingMs }}{{- $_ := set $ad "request_spacing_ms" (int $detail.requestSpacingMs) }}{{- end }}
{{- $ad = mergeOverwrite $ad (deepCopy $user) }}
{{- if or $ad.kids $user }}
{{- range $kid := ($ad.kids | default list) }}
{{- $key := printf "schoology:%s:assignment_detail" $kid }}
{{- $state := "none" }}
{{- range $rule := ($cfg.rules | default list) }}
{{- if eq $state "none" }}
{{- if eq ($rule.match | toString) $key }}
{{- $state = "exact" }}
{{- else if eq ($rule.match | toString) "*" }}
{{- $state = "wildcard" }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq $state "wildcard" }}
{{- fail (printf "schoologyConnector: assignment_detail is enabled for %q but a wildcard rule comes before any rule matching %q in schoologyConnector.config.rules" $kid $key) }}
{{- else if ne $state "exact" }}
{{- fail (printf "schoologyConnector: assignment_detail is enabled for %q but schoologyConnector.config.rules has no rule matching %q" $kid $key) }}
{{- end }}
{{- end }}
{{- $_ := set $cfg "assignment_detail" $ad }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glovebox.fullname" . }}-schoology-config
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
    glovebox.io/connector: schoology
data:
  config.json: |
    {{- $cfg | toJson | nindent 4 }}
{{- end }}
