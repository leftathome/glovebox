{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "glovebox.fullname" . }}
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  podSelector:
    matchLabels:
      {{- include "glovebox.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    - Ingress
  ingress:
    {{- if .Values.config.ingest.enabled }}
    # Ingest: connectors only
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: connector
      ports:
        {{- if include "glovebox.ingestPortServed" . }}
        - port: {{ .Values.config.ingest.port }}
          protocol: TCP
        {{- end }}
        {{- /*
          Bearer-authenticated endpoints on their own listener. Connector
          pods could reach /v1/sanitize when it shared the ingest port, so
          splitting the port must not silently revoke that.
        */}}
        {{- if include "glovebox.bearerPortServed" . }}
        - port: {{ include "glovebox.bearerPort" . }}
          protocol: TCP
        {{- end }}
        {{- if ne .Values.ingest.tls.mode "disabled" }}
        # mTLS listener. Kept alongside the plaintext port rather than
        # replacing it, because permissive mode serves both while
        # connectors migrate. Under required nothing serves /v1/ingest in
        # plaintext: the port above is admitted only while the bearer
        # endpoints still share it, and is not rendered at all once they
        # move to config.ingest.bearerPort.
        - port: {{ .Values.ingest.tls.port }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.bearerCallerNamespaces }}
    # Bearer-authenticated callers from other namespaces (/v1/sanitize,
    # /v1/archives*), selected by the namespace's own name through the
    # API-server-managed kubernetes.io/metadata.name label, which cannot drift
    # the way a hand-applied label can. ONE rule for both endpoints: they share
    # the bearer port and a NetworkPolicy cannot tell URL paths apart -- the
    # per-source bearer token is what separates an archive client from a
    # sanitize caller.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml . | nindent 18 }}
      ports:
        - port: {{ include "glovebox.bearerPort" $ }}
          protocol: TCP
    {{- end }}
    # Metrics. /metrics exposes per-source and per-verdict counters and
    # queue depths -- not content, but enough operational shape (which
    # connectors are active, how often items quarantine) that it is not
    # something every pod in the cluster needs to read. Restrict it to the
    # monitoring namespace when one is named; leave it open otherwise so
    # an install without that label keeps working.
    {{- if .Values.metrics.allowedNamespaceLabel }}
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.metrics.allowedNamespaceLabel }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- else }}
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
  # Egress was a flat deny-all, which the scanner cannot actually run under
  # once policy is enforced: bearer auth fetches its tokens from Vault (and
  # resolves the Vault address through cluster DNS). Flannel never enforced
  # it, so nothing noticed. Everything else the scanner does is local disk.
  egress:
    {{- with .Values.networkPolicy.dns }}
    {{- if .enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- if and .Values.ingest.auth.enabled .Values.networkPolicy.vault.namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.vault.namespace }}
      ports:
        - port: {{ .Values.networkPolicy.vault.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "glovebox.fullname" . }}-connectors
  labels:
    {{- include "glovebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "glovebox.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: connector
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - {}  # connectors need outbound access to external APIs
{{- end }}
