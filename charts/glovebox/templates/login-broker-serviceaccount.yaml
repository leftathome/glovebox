{{- range $name, $b := .Values.loginBrokers }}
{{- if and $b $b.enabled }}
{{- $ctx := dict "name" $name "broker" $b "root" $ }}
---
# One ServiceAccount per login broker, used by nothing else. Its projected
# token is what Vault's Kubernetes auth method sees (role:
# {{ $b.vault.k8sRole }}), so the Vault role must be bound to exactly this
# name and namespace -- and to no other broker's. That binding is what keeps
# one site's broker from reading another site's password.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "glovebox.loginBrokerName" $ctx }}
  labels:
    {{- include "glovebox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: login-broker
    glovebox.io/login-broker: {{ $name }}
automountServiceAccountToken: true
{{- end }}
{{- end }}
