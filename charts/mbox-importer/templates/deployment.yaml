{{- /*
Watcher-mode Deployment (bead glovebox-c9zt binary + glovebox-j2s0 chart).
OPT-IN: renders only when watch.enabled is true. A long-running variant of the
importer that watches <storagePath>/archives for archive/mbox archives finalized
by the spec-13 delivery endpoint, drives the existing per-mbox pipeline against
each, and retires processed archives to archives/.done/. Coexists with the
one-shot Job (job.yaml, gated on archive.archiveID).
*/ -}}
{{- if .Values.watch.enabled -}}
{{- if not .Values.watch.sourceName -}}
{{- fail "watch.sourceName must be set in watcher mode; landed staging items need a source value" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mbox-importer.fullname" . }}-watch
  labels:
    {{- include "mbox-importer.labels" . | nindent 4 }}
spec:
  # Single replica: the watcher processes archives sequentially via one feeder
  # goroutine. A second replica is SAFE (the per-archive O_EXCL .mbox-importer.lock
  # prevents double-pickup) but adds no throughput, so the default is 1.
  replicas: {{ .Values.watch.replicas }}
  strategy:
    # Recreate, not RollingUpdate: the archive-storage PVC is RWO, so two pods
    # cannot mount it simultaneously during a rollout. Recreate tears the old
    # pod down before the new one binds the volume.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mbox-importer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: watch
  template:
    metadata:
      labels:
        {{- include "mbox-importer.labels" . | nindent 8 }}
        app.kubernetes.io/component: watch
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.podNodeName }}
      nodeName: {{ .Values.podNodeName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: {{ include "mbox-importer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --watch-archives={{ include "mbox-importer.archivesDir" . }}
            - --config=/etc/importer/config.json
            - --state-dir=/var/lib/importer/state
            - --ingest-url={{ .Values.glovebox.ingestURL }}
            - --source-name={{ .Values.watch.sourceName }}
            - --concurrency={{ .Values.importer.concurrency }}
            - --health-port={{ .Values.healthPort }}
            {{- if .Values.watch.mediaTypes }}
            - --media-types={{ .Values.watch.mediaTypes }}
            {{- end }}
            {{- if .Values.watch.pollInterval }}
            - --poll-interval={{ .Values.watch.pollInterval }}
            {{- end }}
            {{- if .Values.importer.filterJSON }}
            - --filter=/etc/importer/filter.json
            {{- end }}
            {{- if .Values.importer.fixedTags }}
            - --fixed-tags={{ .Values.importer.fixedTags }}
            {{- end }}
          env:
            {{- if .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/importer
              readOnly: true
            - name: storage
              # NOT readOnly: the watcher writes survey + manifest + checkpoint
              # sidecars next to each archive's mbox, takes the per-archive
              # .mbox-importer.lock, and renames processed archives into
              # archives/.done/.
              mountPath: {{ .Values.archive.storagePath }}
            - name: state
              mountPath: /var/lib/importer/state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "mbox-importer.fullname" . }}-config
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.storageClaim }}
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end -}}
