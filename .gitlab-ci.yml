# GitLab CI configuration for the gitlab.orac.local mirror of leftathome/glovebox.
#
# The canonical CI is GitHub Actions (.github/workflows/ci.yml) which handles
# the full pipeline: tests, multi-arch binaries, docker images for every
# connector, helm chart push, SBOM, attestation, and security scans. This
# file mirrors only the essential MR-gate checks (vet + go test with race
# detector) so MRs on the gitlab side have a real signal before merge.
#
# Release artifacts continue to flow through the GitHub Actions release.yml
# pipeline. This config is intentionally narrow.

stages:
  - test

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  # Tell Go to use the module cache aggressively.
  GOFLAGS: "-mod=mod"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go/pkg/mod
    - .cache/go-build

test:
  stage: test
  image: golang:1.26
  before_script:
    - "go version"
    - "go env GOPATH GOMODCACHE GOCACHE"
  script:
    - "go vet ./..."
    - "go test ./... -count=1 -race"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
