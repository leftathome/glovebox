# GitLab CI configuration for gitlab.orac.local (leftathome/glovebox).
#
# PRIMARY (gitlab-first) build + publish pipeline. This is the canonical
# build-and-publish pipeline for the homelab: it runs tests, builds every
# container image with kaniko, and publishes images + the OCI Helm chart to the
# built-in Container Registry.
#
# All homelab-infra detail (node pinning, pod sizing, the in-cluster registry
# Service, kaniko CA workarounds) lives in the PRIVATE homelab/ci-templates
# project and is pulled in via the `include:` below. This file is mirrored to
# public github, so it deliberately contains NO cluster specifics -- only the
# non-sensitive, project-specific job wiring (image matrix, chart path, etc.).
#
# GitHub Actions (.github/workflows/ci.yml) remains a MIRROR that publishes the
# same image set to ghcr.io; image naming and tag conventions are kept in sync
# so artifacts are interchangeable. (The enricher Dockerfiles default their
# ENRICHER_BASE build-arg to the ghcr image, so the GitHub mirror is unaffected
# by the ENRICHER_BASE override set here.)
#
# NOTE: the former build-mr-sanity job (a bespoke --no-push kaniko build on MRs)
# was dropped -- it needed kaniko infra inlined here, which is no longer allowed
# in this public-mirrored file. The `test` job remains the MR gate.

include:
  - project: 'homelab/ci-templates'
    ref: v0.1.1
    file: '/kaniko.yml'

stages:
  - test
  - integration
  - integration-report
  - build-base
  - build
  - chart
  - release

# RETRY INFRASTRUCTURE FAILURES ONLY. Main pipeline 4101 lost four image
# builds and test-journal-db (4102 lost test-journal-db again) to
# runner_system_failure: the job pod was SIGKILLed mid-run (exit 137,
# reason Error) or went Failed before starting, with no OOM kill and no
# eviction recorded on johnny. A retry re-runs the job on a fresh pod; a
# test or build that fails on its own merits (script_failure) is never
# retried, so this cannot hide a real failure.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  # Tell Go to use the module cache aggressively.
  GOFLAGS: "-mod=mod"
  # Immutable tag the enricher base is referenced by within a single pipeline.
  # build-base always publishes this tag, so dependent images can FROM it
  # deterministically (no :latest race).
  ENRICHER_TAG: "$CI_COMMIT_SHORT_SHA"
  # NOTE: KUBERNETES_* pod scheduling/sizing and INTERNAL_REGISTRY_* come from
  # the included homelab/ci-templates global variables -- do not redefine here.

# Go cache: the module cache plus the build cache, keyed on go.sum.
#
# ONE OWNER. Only the jobs that run Go carry it (test, test-journal-db and
# the .integration jobs, via the anchor below -- not a global `cache:`), and
# they only PULL it, except `test` on main, which is the single job that
# uploads (its policy is $GO_CACHE_POLICY, pull-push only on main). `test` is
# the writer, not a separate warm-up job, because it already builds
# everything the others read (build, vet, the oapi-codegen tool through
# check-codegen.sh, the race test binaries) and is pinned to the cluster: a
# separate writer cost a third concurrent ~4.5GB cache extraction on johnny
# per main pipeline, beside test and test-journal-db, and on 2026-11-09 that
# saturated johnny's disk and took ingress down. Before this, the cache was global and pull-push: the Go jobs each
# downloaded and re-uploaded it, and build-base, every image in the build
# matrix, chart and release, which never read it, downloaded and extracted it
# for nothing. The runner's HELPER container does that archiving and
# extracting, and it carries no memory request or limit: glovebox's helper
# peaked at 3.4GiB over 7 days, invisible to the scheduler, on johnny. An MR
# pipeline now uploads nothing.
.go-cache: &go_cache
  key:
    files:
      - go.sum
  paths:
    - .cache/go/pkg/mod
    - .cache/go-build
  policy: pull

# Local anchor: build/publish only on main and tags (within this one file --
# anchors do not cross the include boundary, which is fine since this is the
# only place these rules are reused).
#
# The leading `never` guard is load-bearing: a scheduled (nightly) or manual
# (web) pipeline targeting `main` would otherwise match `$CI_COMMIT_BRANCH ==
# "main"` and rebuild every image nightly (burning the Docker Hub pull limit).
# The integration stage is the ONLY thing that runs on schedule/web.
.build_rules: &build_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test (MR gate -- vet + race tests). Inherits node selector / pod sizing from
# the included global variables automatically.
# ---------------------------------------------------------------------------
test:
  stage: test
  cache:
    <<: *go_cache
    policy: $GO_CACHE_POLICY
  # Pinned to a concrete patch tag rather than the floating `golang:1.27`.
  #
  # The cluster pulls docker.io through Zot, and Zot cannot commit the floating
  # tag's manifest: it fetches it from Docker Hub, fails with "invalid manifest
  # content" (sync/destination.go copyManifest), then falls through to the other
  # configured upstreams -- ghcr.io, registry.k8s.io, quay.io -- none of which
  # carry library/golang, and finally answers containerd 404 after ~8 minutes.
  # The job dies as `runner_system_failure` at prepare-environment with no test
  # output, which reads as a broken runner rather than a registry problem.
  #
  # Measured against Zot on 2026-09-09: 1.27.1-bookworm HEAD 200; 1.27,
  # 1.27.0-bookworm and 1.26 all time out. No node holds any 1.27 image, so
  # Spegel has no peer to serve one either.
  #
  # This keeps the toolchain at 1.27, matching the GitHub mirror, rather than
  # reverting the Go bump to work around a registry fault. Revert to the
  # floating tag once gitops-br8e is fixed.
  image: golang:1.27.3-bookworm
  # Memory: `go test -race ./...` builds and runs every package in parallel,
  # and the root package re-runs the whole core binary under the race
  # detector. At the runner's default 4Gi limit the job was OOM-killed (exit
  # 137) on main pipeline 4056 after passing on the MR. -p 4 bounds how many
  # packages build and run at once. The request stays modest (2Gi) so a burst
  # of Renovate MR pipelines can still schedule; the 8Gi limit is what stops
  # the OOM kill.
  #
  # Cluster runner only. The KUBERNETES_* sizing above means nothing to the
  # untagged tak runner (docker executor in Docker Desktop), and there the root
  # package's test binary was killed (`signal: killed`, main pipeline 4138) or
  # missed its 60s delivery deadlines (MR !119 pipeline 4128); on the cluster
  # runner the same commits pass.
  tags: [cluster]
  variables:
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    # Pull everywhere; the main rule below makes this job the cache writer.
    GO_CACHE_POLICY: "pull"
  before_script:
    - "go version"
    - "go env GOPATH GOMODCACHE GOCACHE"
  script:
    # go.mod and go.sum must be complete and tidy. GOFLAGS=-mod=mod (above)
    # lets go add missing entries during the build, which hid three
    # incomplete dependency bumps (kin-openapi, x/text, pgx) until the image
    # build failed on main; the readonly build that followed (glovebox-60ot)
    # compiles no test files, so a fourth (kin-openapi v0.153.0, whose new
    # dependencies only a test imports) still merged and broke `go vet`.
    # `go mod tidy -diff` covers test imports on every platform: it prints
    # the missing change and exits non-zero without writing anything.
    - "go mod tidy -diff"
    - "GOFLAGS=-mod=readonly go build ./..."
    - "go vet ./..."
    - "./scripts/check-codegen.sh"
    - "go test ./... -count=1 -race -p 4"
  rules:
    # Keep the unit gate off schedule/web pipelines -- those run only the
    # integration stage (see .build_rules for the same guard rationale).
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        GO_CACHE_POLICY: "pull-push"
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test-journal-db: the record journal's database tests against PostgreSQL --
# the CloudNativePG image at the version production runs (17.10, read from
# the databases-app Cluster on 2026-10-16; bump it with the cluster, and
# JOURNAL_PG_IMAGE in scripts/journal-test-db.sh). The CNPG image has no
# Docker entrypoint, so the service overrides it and runs initdb itself.
# The `test` job above runs `go test ./...`, in which every database test
# skips (no JOURNAL_TEST_DATABASE_URL); this job is where they actually run.
# JOURNAL_TEST_REQUIRE_DB turns "no database" into a failure instead of a
# skip. Runs on every MR, so any schema change reruns them. The PowerSchool
# connector package is in the list for its end-to-end records test against
# the journal core (TestRecordsAgainstTheJournal).
#
# Tagged `cluster`: services run as sidecar containers of the job pod, which
# only the Kubernetes executor does, and the pod sizing below is honoured
# there (requests capped at 16Gi / 4 CPU). The service is reached on the
# loopback of the shared pod network namespace.
#
# Sizing: the lock tests have 700ms-5s deadlines and the scanner warms up
# before the first scan, so a CPU-starved pod (the default is 250m) flakes.
# 1 CPU / 3Gi for the job (-race multiplies the memory of the test binaries)
# and 500m / 512Mi for the Postgres sidecar (fsync=off, a throwaway data
# directory in /tmp). Limits are left to the template defaults.
#
# The trust-auth superuser with no password is a throwaway: the server lives
# only inside this job's pod and listens on its loopback, so there is no
# credential here to protect.
# ---------------------------------------------------------------------------
test-journal-db:
  # One database test job at a time across pipelines: a burst of Renovate MR
  # pipelines otherwise leaves their pods Pending past the runner's 900s
  # poll_timeout (pipelines 4063, 4065). resource_group queues the job in
  # GitLab, which has no such timeout.
  resource_group: glovebox-journal-db-tests
  stage: test
  cache: *go_cache
  tags: [cluster]
  image: golang:1.27.3-bookworm
  services:
    - name: ghcr.io/cloudnative-pg/postgresql:18.6
      alias: postgres
      entrypoint: ["/bin/sh", "-c"]
      command: ["initdb -D /tmp/pg -U postgres --auth=trust >/dev/null && exec postgres -D /tmp/pg -c listen_addresses='*' -c fsync=off"]
  variables:
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    KUBERNETES_SERVICE_CPU_REQUEST: "500m"
    KUBERNETES_SERVICE_MEMORY_REQUEST: "512Mi"
    JOURNAL_TEST_DATABASE_URL: "postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
    JOURNAL_TEST_REQUIRE_DB: "1"
  before_script:
    - "go version"
  script:
    - "go test ./internal/journal/... ./connectors/powerschool/ ./connectors/schoology/ . -count=1 -race -p 4"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# chart-test (MR gate): helm lint and every scripts/test-chart-*.sh, via
# scripts/chart-checks.sh. These pin what the chart renders -- workload
# identities, token mounts, RBAC bindings, NetworkPolicies, the PowerSchool
# login blackout -- and were run by hand only, so a chart change could merge
# with them red.
#
# Same pinned golang image as `test` (the one Zot is known to serve; see the
# note there) rather than a helm image from Docker Hub. helm is built with
# `go install` at the version scripts/install-helm.sh pins (the Go module
# proxy and checksum database verify it): the build containers on this
# instance's runner cannot resolve get.helm.sh (2026-10-16), while the module
# proxy works, as the `test` job shows. GitHub uses install-helm.sh. origin/main is
# fetched because test-chart-serviceaccounts.sh compares the render against it,
# and fails rather than skips in CI when it cannot.
# ---------------------------------------------------------------------------
chart-test:
  stage: test
  image: golang:1.27.3-bookworm
  cache: []
  before_script:
    - "apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-yaml >/dev/null"
    - 'HELM_VERSION=$(sed -n ''s/^HELM_VERSION="${HELM_VERSION:-\(v[0-9.]*\)}"$/\1/p'' scripts/install-helm.sh); test -n "$HELM_VERSION"; GOBIN=/usr/local/bin go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"'
    - "helm version --short"
    - "git fetch --quiet --depth=50 origin +refs/heads/main:refs/remotes/origin/main"
  script:
    - "./scripts/chart-checks.sh"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# integration: in-cluster connector integration tests (sub-project B / lyku.3).
#
# Runs ONLY on a scheduled (nightly) pipeline or a manual (web) trigger -- NOT
# on MRs, main, or tags -- so live-upstream flakiness and rate limits stay out
# of the merge/build path (the `test` job remains the merge gate). Because the
# `test`/`build` jobs do not run on schedule/web, integration jobs are
# self-contained and carry NO `needs:` on them.
#
# Each job sets GLOVEBOX_INTEGRATION=1 and runs the connector's
# `//go:build integration` live test. Node selector / pod sizing are inherited
# from the included homelab/ci-templates global variables (same as `test`), so
# no cluster specifics appear here. Credentialed connectors (later) additionally
# pull an ESO-synced secret bound in the PRIVATE homelab/ci-templates; the
# no-credential connectors below need none.
#
# Exit-code contract: a genuine test failure fails the job (nightly goes red); a
# connector that SKIPs (creds/env not provisioned -- e.g. semantic-scholar with
# no API key, or any RequireCreds/RequireIntegration guard) keeps the job green
# and is surfaced by the integration-report summary. Each job records its
# PASS/SKIP/FAIL verdict as an artifact the report job aggregates.
# ---------------------------------------------------------------------------
.integration:
  stage: integration
  cache: *go_cache
  # Pinned to a concrete patch tag rather than the floating `golang:1.27`.
  #
  # The cluster pulls docker.io through Zot, and Zot cannot commit the floating
  # tag's manifest: it fetches it from Docker Hub, fails with "invalid manifest
  # content" (sync/destination.go copyManifest), then falls through to the other
  # configured upstreams -- ghcr.io, registry.k8s.io, quay.io -- none of which
  # carry library/golang, and finally answers containerd 404 after ~8 minutes.
  # The job dies as `runner_system_failure` at prepare-environment with no test
  # output, which reads as a broken runner rather than a registry problem.
  #
  # Measured against Zot on 2026-09-09: 1.27.1-bookworm HEAD 200; 1.27,
  # 1.27.0-bookworm and 1.26 all time out. No node holds any 1.27 image, so
  # Spegel has no peer to serve one either.
  #
  # This keeps the toolchain at 1.27, matching the GitHub mirror, rather than
  # reverting the Go bump to work around a registry fault. Revert to the
  # floating tag once gitops-br8e is fixed.
  image: golang:1.27.3-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    GLOVEBOX_INTEGRATION: "1"
  before_script:
    - "go version"
  script:
    - "mkdir -p integration-status"
    - "go test -tags integration -v -count=1 ./connectors/$CONNECTOR/ > out.txt 2>&1; code=$?"
    - "cat out.txt"
    - 'if [ $code -ne 0 ]; then st=FAIL; elif grep -q -- "--- SKIP" out.txt; then st=SKIP; else st=PASS; fi'
    - 'echo "$CONNECTOR $st" > integration-status/$CONNECTOR.txt'
    - "exit $code"
  artifacts:
    when: always
    paths:
      - integration-status/
    expire_in: 1 week

integration:rss:
  extends: .integration
  variables:
    CONNECTOR: rss

integration:hackernews:
  extends: .integration
  variables:
    CONNECTOR: hackernews

integration:arxiv:
  extends: .integration
  variables:
    CONNECTOR: arxiv

# semantic-scholar is test-account (keyless public tier 429s + the connector
# swallows the error); with no SEMANTIC_SCHOLAR_API_KEY provisioned it SKIPs
# clean (job stays green) and is listed as skipped in the report. Its key is
# bound via ESO in the private ci-templates when provisioned.
integration:semantic-scholar:
  extends: .integration
  variables:
    CONNECTOR: semantic-scholar

# schoology is the reference CREDENTIALED connector (real-readonly household
# session). Its secret (SCHOOLOGY_HOST / SCHOOLOGY_CREDENTIALS_FILE /
# SCHOOLOGY_KID_UID) is bound via an ESO ExternalSecret in the PRIVATE
# homelab/ci-templates; until that is provisioned the test SKIPs clean (green).
# allow_failure is TEMPORARY: a child's Schoology surfaces can legitimately be
# empty at any given moment (so a real run may assert-fail on staged>=1 until a
# min-content window/fixture is agreed), and the session path is still being
# brought up -- neither should red the nightly. Remove allow_failure once the
# secret is wired and a reliable min-content source is chosen (registry note).
integration:schoology:
  extends: .integration
  allow_failure: true
  variables:
    CONNECTOR: schoology

# ---------------------------------------------------------------------------
# integration-report: aggregate each connector job's PASS/SKIP/FAIL verdict so
# coverage gaps (skipped connectors) are visible at a glance. Runs `when: always`
# so it reports even when a connector job failed; pulls each job's status
# artifact. Does not itself fail the pipeline -- the connector jobs already do.
# ---------------------------------------------------------------------------
integration-report:
  stage: integration-report
  image: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  when: always
  needs:
    - job: integration:rss
      artifacts: true
    - job: integration:hackernews
      artifacts: true
    - job: integration:arxiv
      artifacts: true
    - job: integration:semantic-scholar
      artifacts: true
    - job: integration:schoology
      artifacts: true
  script:
    - 'echo "=== Connector integration summary ==="'
    - "cat integration-status/*.txt 2>/dev/null || echo '(no status artifacts collected)'"
    - 'echo "-----"'
    - 'echo "PASS = live round-trip verified; SKIP = creds/env not provisioned (expected until Vault/ESO wired); FAIL = real failure (job above is red)."'

# ---------------------------------------------------------------------------
# build-base: the enricher-runtime base image. MUST publish before `build`
# so enricher-based connectors/importers can FROM it.
# ---------------------------------------------------------------------------
build-base:
  tags: [cluster]
  extends: .kaniko-build
  stage: build-base
  needs: ["test"]
  variables:
    IMAGE: glovebox-enricher-runtime
    DOCKERFILE: Dockerfile.enricher-runtime
  rules: *build_rules
  # Same bound as `build` (glovebox-if8s): a hung base-image pull fails
  # after 40 min rather than the 1h default.
  timeout: 40m

# ---------------------------------------------------------------------------
# build: every connector + importer + the main image, in parallel via matrix.
# Enricher-based images build FROM the just-published base by setting
# ENRICHER_BASE (referenced by variable name; the literal Service URL lives in
# the template's INTERNAL_REGISTRY_REPO).
# ---------------------------------------------------------------------------
build:
  tags: [cluster]
  extends: .kaniko-build
  stage: build
  needs: ["build-base"]
  rules: *build_rules
  # Bounded below GitLab's 1h default (glovebox-if8s): successful builds take
  # 6-37 min, so a base-image pull that hangs on the registry mirror now
  # costs this lane at most 40 min instead of the full hour.
  timeout: 40m
  # THREE BUILD LANES. Every build pod is pinned to johnny (ci-templates),
  # requests 2Gi and peaks at ~3.4Gi working set; johnny has ~9Gi left after
  # its resident workloads, so about three fit. Unbounded, the runner starts
  # up to `concurrent` (6) at once and the surplus pods sit Pending until the
  # runner's 900s poll_timeout fails them (main pipeline 4092: 10 of 32 builds
  # failed that way, none in the build itself). A resource_group per lane
  # caps glovebox at three concurrent builds; the rest wait in GitLab's
  # queue, which has no timeout. New matrix entries: take the next lane.
  resource_group: glovebox-build-$BUILD_LANE
  parallel:
    matrix:
      # --- main ---
      - IMAGE: glovebox
        DOCKERFILE: ./Dockerfile
        BUILD_LANE: "a"
      # --- connectors (distroless; no enricher base) ---
      - IMAGE: glovebox-bluesky
        DOCKERFILE: ./connectors/bluesky/Dockerfile
        BUILD_LANE: "b"
      - IMAGE: glovebox-gcalendar
        DOCKERFILE: ./connectors/gcalendar/Dockerfile
        BUILD_LANE: "c"
      - IMAGE: glovebox-gdrive
        DOCKERFILE: ./connectors/gdrive/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-github
        DOCKERFILE: ./connectors/github/Dockerfile
        BUILD_LANE: "b"
      - IMAGE: glovebox-gitlab
        DOCKERFILE: ./connectors/gitlab/Dockerfile
        BUILD_LANE: "c"
      - IMAGE: glovebox-hackernews
        DOCKERFILE: ./connectors/hackernews/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-jira
        DOCKERFILE: ./connectors/jira/Dockerfile
        BUILD_LANE: "b"
      - IMAGE: glovebox-linkedin
        DOCKERFILE: ./connectors/linkedin/Dockerfile
        BUILD_LANE: "c"
      # The login broker: debian:bookworm-slim + Chromium like the
      # PowerSchool login job below, and for the same reason (see the
      # Dockerfile). One image for every site.
      - IMAGE: glovebox-login-broker
        DOCKERFILE: ./connectors/login-broker/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-meta
        DOCKERFILE: ./connectors/meta/Dockerfile
        BUILD_LANE: "b"
      - IMAGE: glovebox-notion
        DOCKERFILE: ./connectors/notion/Dockerfile
        BUILD_LANE: "c"
      - IMAGE: glovebox-onedrive
        DOCKERFILE: ./connectors/onedrive/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-powerschool
        DOCKERFILE: ./connectors/powerschool/Dockerfile
        BUILD_LANE: "b"
      # debian:bookworm-slim + Chromium, not distroless: powerschool-go can
      # only drive a local browser (see the Dockerfile).
      - IMAGE: glovebox-powerschool-auth-refresher
        DOCKERFILE: ./connectors/powerschool-auth-refresher/Dockerfile
        BUILD_LANE: "c"
      - IMAGE: glovebox-rss
        DOCKERFILE: ./connectors/rss/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-schoology
        DOCKERFILE: ./connectors/schoology/Dockerfile
        BUILD_LANE: "b"
      - IMAGE: glovebox-schoology-auth-refresher
        DOCKERFILE: ./connectors/schoology-auth-refresher/Dockerfile
        BUILD_LANE: "c"
      - IMAGE: glovebox-steam
        DOCKERFILE: ./connectors/steam/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-teams
        DOCKERFILE: ./connectors/teams/Dockerfile
        BUILD_LANE: "b"
      - IMAGE: glovebox-trello
        DOCKERFILE: ./connectors/trello/Dockerfile
        BUILD_LANE: "c"
      - IMAGE: glovebox-x
        DOCKERFILE: ./connectors/x/Dockerfile
        BUILD_LANE: "a"
      - IMAGE: glovebox-youtube
        DOCKERFILE: ./connectors/youtube/Dockerfile
        BUILD_LANE: "b"
      # --- connectors (enricher-runtime base) ---
      - IMAGE: glovebox-arxiv
        DOCKERFILE: ./connectors/arxiv/Dockerfile
        BUILD_LANE: "c"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      - IMAGE: glovebox-gmail
        DOCKERFILE: ./connectors/gmail/Dockerfile
        BUILD_LANE: "a"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      - IMAGE: glovebox-imap
        DOCKERFILE: ./connectors/imap/Dockerfile
        BUILD_LANE: "b"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      - IMAGE: glovebox-outlook
        DOCKERFILE: ./connectors/outlook/Dockerfile
        BUILD_LANE: "c"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      - IMAGE: glovebox-semantic-scholar
        DOCKERFILE: ./connectors/semantic-scholar/Dockerfile
        BUILD_LANE: "a"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      # --- importers (enricher-runtime base) ---
      - IMAGE: glovebox-apple-importer
        DOCKERFILE: ./importers/apple/Dockerfile
        BUILD_LANE: "b"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      - IMAGE: glovebox-mbox-importer
        DOCKERFILE: ./importers/mbox/Dockerfile
        BUILD_LANE: "c"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"
      - IMAGE: glovebox-walhelm-importer
        DOCKERFILE: ./importers/walhelm/Dockerfile
        BUILD_LANE: "a"
        ENRICHER_BASE: "$INTERNAL_REGISTRY_REPO/glovebox-enricher-runtime:$CI_COMMIT_SHORT_SHA"

# ---------------------------------------------------------------------------
# chart: package + push the Helm chart as an OCI artifact. On a tag, the chart
# version/appVersion are stamped from the tag by the template.
# ---------------------------------------------------------------------------
chart:
  tags: [cluster]
  extends: .helm-push
  stage: chart
  needs: ["build"]
  variables:
    CHART_PATH: charts/glovebox
  rules: *build_rules

# ---------------------------------------------------------------------------
# release: create a GitLab Release for the tag.
#
# allow_failure is true for now: the orac instance uses a PRIVATE CA, and
# release-cli talks to the GitLab API over HTTPS, which the executor pod can't
# verify (the cluster CA isn't mounted into job pods) -- so this call hits x509
# unknown-authority, exactly the CA problem the build/chart jobs route AROUND by
# using the in-cluster registry Service over plain HTTP. There is no plain-HTTP
# equivalent for the GitLab API, hence allow_failure. The fix is to trust the
# orac CA in the runner image (mount/append the CA bundle). Until then, a TLS
# hiccup here must not fail the whole pipeline -- the images and chart are
# already published by the time we reach this stage. Remove allow_failure once
# the CA is trusted.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
