name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  checks: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/leftathome

jobs:
  # One place decides what this repository ships. Consumed by build-docker's
  # matrix below and by release.yml, so a connector cannot be built as an
  # image but forgotten in the release archive (which is exactly what had
  # happened: releases carried 10 of 24 connectors and no importers).
  discover-targets:
    name: Discover build targets
    runs-on: ubuntu-latest
    # Reads the checkout and nothing else. Declared rather than inherited so
    # this job keeps least privilege whatever the workflow default becomes.
    permissions:
      contents: read
    outputs:
      images: ${{ steps.targets.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List container images
        id: targets
        # Assign first, echo second: a bare `echo "$(...)"` would swallow a
        # failing script into an empty output and hand build-docker an
        # unparseable matrix instead of failing here.
        run: |
          images=$(scripts/build-targets.sh images-json)
          echo "images=$images" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Check generated code is up to date
        run: ./scripts/check-codegen.sh

      # A discovery bug that returned nothing would leave every build job
      # green while shipping no binaries and no images. Fail here instead.
      - name: Check every component is a build target
        run: ./scripts/build-targets.sh check

      - name: Vet
        run: go vet ./...

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Test
        run: |
          go test ./... -count=1 -race -v 2>&1 | go-junit-report -set-exit-code > test-report.xml

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: 'Go Test Results'
          path: 'test-report.xml'
          reporter: 'java-junit'

      - name: Test Summary
        if: always()
        run: |
          if [ -f test-report.xml ]; then
            TESTS=$(grep -c '<testcase' test-report.xml 2>/dev/null || true)
            FAILURES=$(grep -c '<failure' test-report.xml 2>/dev/null || true)
            SKIPPED=$(grep -c '<skipped' test-report.xml 2>/dev/null || true)
            TESTS=${TESTS:-0}
            FAILURES=${FAILURES:-0}
            SKIPPED=${SKIPPED:-0}
            PASSED=$((TESTS - FAILURES - SKIPPED))
            echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Status | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Passed | ${PASSED} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Failed | ${FAILURES} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Skipped | ${SKIPPED} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Total** | **${TESTS}** |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report found." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # Build list comes from scripts/build-targets.sh, not from a literal
      # here: the literal it replaces had fallen 14 connectors and one
      # importer behind the container matrix.
      - name: Build all binaries
        run: |
          # Via a file, not a pipe: in `script | while read`, a failure of the
          # script leaves the loop's exit status intact, so an empty list
          # would build nothing and still pass.
          scripts/build-targets.sh binaries > "${RUNNER_TEMP}/targets.tsv"
          while IFS=$'\t' read -r name target; do
            echo "Building $name..."
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "${name}${{ matrix.ext || '' }}" "$target"
          done < "${RUNNER_TEMP}/targets.tsv"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            glovebox${{ matrix.ext || '' }}
            *-connector${{ matrix.ext || '' }}
            *-importer${{ matrix.ext || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            glovebox${{ matrix.ext || '' }}
            *-connector${{ matrix.ext || '' }}
            *-importer${{ matrix.ext || '' }}
            sbom.spdx.json

  build-docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Several images here use ghcr.io/leftathome/glovebox-enricher-runtime:latest
    # as their runtime base (rebased connectors, mbox-importer, walhelm-importer).
    # Depend on build-enricher-runtime so we build against the freshly published
    # base instead of racing it and pulling a stale :latest. On PRs
    # build-enricher-runtime does not push, so this ordering only affects push
    # events -- which is exactly where the stale-:latest race would occur.
    needs: [discover-targets, test, build-enricher-runtime]
    strategy:
      fail-fast: false
      # Every component with a Dockerfile, discovered by
      # scripts/build-targets.sh rather than listed here. The hand-written
      # matrix this replaces had drifted from the release and binary build
      # lists; deriving all three from one place is what keeps a new
      # connector from silently shipping no image, no binary, or neither.
      matrix:
        include: ${{ fromJSON(needs.discover-targets.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  build-enricher-runtime:
    # Base image for connectors that need binary-dependent enrichers
    # (PDF, OCR, office). Built from debian:bookworm-slim with
    # poppler-utils, tesseract-ocr+eng, pandoc, ca-certificates.
    # Spec: docs/specs/14-content-enrichment-design.md sec 6.1.
    # Task: glovebox-afq4.5.
    #
    # Sequenced as: (1) load into local daemon for testing,
    # (2) run scripts/test-enricher-runtime.sh which asserts binary
    # presence, nonroot identity, and size bounds, (3) push multi-arch
    # to GHCR if the in-daemon test passed and this is a push event.
    name: Docker (glovebox-enricher-runtime)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for local test (amd64 only, load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.enricher-runtime
          push: false
          load: true
          tags: glovebox-enricher-runtime:test
          platforms: linux/amd64
          cache-from: type=gha,scope=glovebox-enricher-runtime
          cache-to: type=gha,scope=glovebox-enricher-runtime,mode=max

      - name: Test built image (binaries, nonroot, size)
        run: bash scripts/test-enricher-runtime.sh

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/glovebox-enricher-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push (multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.enricher-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=glovebox-enricher-runtime
          cache-to: type=gha,scope=glovebox-enricher-runtime,mode=max

  build-smoke-enrichment:
    # Spec-14 §7.3 end-to-end enrichment smoke harness image. Built FROM the
    # glovebox-enricher-runtime base (same base as the rebased connectors)
    # so pdftotext / tesseract / pandoc presence is exercised exactly as in
    # production. Published so operators can run
    # `scripts/smoke-enrichment.sh --use-registry-images <tag>` from a clean
    # machine without rebuilding. Task: glovebox-afq4.16.
    #
    # Sequenced as: (1) build-from-source + run all scenarios via the
    # script's --use-local-images mode (always-on gate, no published image
    # needed); (2) on push, build+push multi-arch to GHCR; (3) on a main
    # push, re-run the smoke against the just-published image via
    # --use-registry-images to exercise that path end-to-end.
    name: Docker (glovebox-smoke-enrichment)
    runs-on: ubuntu-latest
    needs: build-enricher-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Smoke (build local image + run all scenarios)
        run: bash scripts/smoke-enrichment.sh --use-local-images

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/glovebox-smoke-enrichment
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push (multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/smoke-enrichment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=glovebox-smoke-enrichment
          cache-to: type=gha,scope=glovebox-smoke-enrichment,mode=max

      - name: Smoke (pull published image + run all scenarios)
        # Only on a main push, where the `latest` tag was just published
        # above. Exercises the --use-registry-images path end-to-end so the
        # registry mode does not rot (the gap glovebox-afq4.16 tracked).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/smoke-enrichment.sh --use-registry-images latest

  helm:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a v* tag, stamp the chart + appVersion from the tag so the published
      # chart version always tracks the release. On a plain main push, fall back
      # to Chart.yaml's version. Previously this always used Chart.yaml's static
      # version, so tagged releases silently re-published a stale chart
      # (glovebox-fslv sibling: chart never bumped for v0.6.0).
      - name: Package Helm chart
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            echo "tagged release: packaging chart version ${V}"
            helm package charts/glovebox --version "${V}" --app-version "${V}"
          else
            helm package charts/glovebox
          fi

      - name: Push Helm chart to GHCR
        run: |
          helm push glovebox-*.tgz oci://${{ env.IMAGE_PREFIX }}/charts

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # Pinned to v1.5.0 (glovebox-fslv): v1.4.0 segfaulted analysing our
      # generics under go1.26 (x/tools ForEachElement / *types.TypeParam panic),
      # which forced continue-on-error. v1.5.0 fixes the crash (verified clean
      # under go1.26), so govulncheck is GATING again. Pinned rather than @latest
      # so a future tool regression can't silently re-break the gate; bump the
      # pin deliberately (Renovate / manual) with CI confirming it still runs.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
