name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-notes.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The literal target list this replaces held 10 of 24 connectors and
      # no importers at all, so every release archive silently contradicted
      # the README's "all connector binaries". scripts/build-targets.sh is
      # the same list ci.yml builds and containerises.
      - name: Build release binaries
        run: |
          mkdir -p release
          platforms="linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64"
          scripts/build-targets.sh binaries > "${RUNNER_TEMP}/targets.tsv"

          for plat in $platforms; do
            GOOS="${plat%/*}"
            GOARCH="${plat#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

            DIR="dist/${GOOS}-${GOARCH}"
            mkdir -p "$DIR"

            while IFS=$'\t' read -r name target; do
              echo "Building ${name} for ${GOOS}/${GOARCH}..."
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="-s -w" -o "${DIR}/${name}${EXT}" "$target"
            done < "${RUNNER_TEMP}/targets.tsv"

            TAG="${{ steps.changelog.outputs.tag }}"
            case "$GOOS" in
              windows)
                (cd "$DIR" && zip -r "../../release/glovebox-${TAG}-${GOOS}-${GOARCH}.zip" .)
                ;;
              *)
                tar -czf "release/glovebox-${TAG}-${GOOS}-${GOARCH}.tar.gz" -C "$DIR" .
                ;;
            esac
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: release-notes.md
          files: |
            release/*
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, '-') }}
