# Values for scripts/test-chart-journal.sh and the config fixture
# (internal/config/testdata/helm-rendered-journal.json). Placeholder
# addresses and ids only.
#
# They assume release "glovebox" in namespace "openclaw" (the services keys
# say openclaw/glovebox-glovebox-connector-...). `helm lint -f` with these
# values renders as release "test-release" in namespace "default", so the
# writer cross-check refuses it (powerschool has no write_types under
# default/test-release-...): that is expected. The tests render with
# `-n openclaw` and release "glovebox".
journal:
  enabled: true
  database:
    host: postgres-rw.databases-app.svc.cluster.local
    existingSecret: glovebox-journal-db
  roster:
    configMap: openclaw-household
  services:
    openclaw/openclaw-gateway:
      read: true
      readers: "*"
      counts: true
    openclaw/glovebox-journal-admin:
      admin: true
    openclaw/glovebox-glovebox-connector-powerschool:
      write_types: [assignment]
      write_scopes: {source: [powerschool]}
      write_subjects: roster_subjects
  recordTypes:
    - name: assignment
      schema_version: 1
      owner: powerschool
      fields:
        title: {type: string}
        due: {type: date}
      default_audience: [subject, guardians]
  staleness:
    - prefix: "source=powerschool/"
      maxAgeHours: 96
  networkPolicy:
    writerConnectors: [powerschool]
    from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: openclaw-gateway
    kubernetesAPICIDRs: [192.0.2.10/32]
metrics:
  prometheusRule:
    enabled: true
